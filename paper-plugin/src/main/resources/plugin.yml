name: MineAgent
version: '${version}'
main: com.mineagent.paper.MineAgentPlugin
api-version: '26.2'
description: MineAgent 后端连接插件（WebSocket）
author: jurky123
commands:
  mineagent:
    description: MineAgent 状态、重连与操作审批
    usage: /mineagent <status|reconnect|approve|deny> [审批ID]
    aliases: [ma]
permissions:
  mineagent.admin:
    description: 允许 /mineagent status|reconnect
    default: op
  mineagent.approve:
    description: 允许批准/拒绝 MineAgent 的高权限操作
    default: op
