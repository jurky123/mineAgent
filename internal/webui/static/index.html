<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MineAgent</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --text: #e6e8ee; --dim: #9aa3b2; --accent: #4f8cff; --accent2: #2f6fe0;
    --user: #2f6fe0; --agent: #1e222b; --ok: #39c07a; --warn: #e0a23f; --err: #e05c5c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); font: 15px/1.6 -apple-system, BlinkMacSystemFont,
    "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
  }
  a { color: var(--accent); }
  button { font: inherit; cursor: pointer; }
  #login { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card {
    width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 28px 24px;
  }
  .card h1 { margin: 0 0 6px; font-size: 22px; }
  .card p { margin: 0 0 18px; color: var(--dim); font-size: 13px; }
  .card input {
    width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; outline: none;
  }
  .card input:focus { border-color: var(--accent); }
  .card button {
    width: 100%; margin-top: 14px; padding: 11px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; font-weight: 600;
  }
  .card button:disabled { opacity: .6; }
  .err { color: var(--err); font-size: 13px; min-height: 18px; margin-top: 8px; }
  #chat { flex: 1; display: none; flex-direction: column; min-height: 0; }
  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header .title { font-weight: 700; }
  header .who { color: var(--dim); font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .badge.admin { color: var(--ok); border-color: var(--ok); }
  header .leave { background: none; border: 0; color: var(--dim); font-size: 13px; }
  #list { flex: 1; overflow-y: auto; padding: 16px 14px 8px; scroll-behavior: smooth; }
  .row { display: flex; margin-bottom: 14px; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: min(680px, 86%); padding: 10px 13px; border-radius: 14px;
    background: var(--agent); border: 1px solid var(--line); overflow-wrap: anywhere;
  }
  .row.user .bubble { background: var(--user); border-color: var(--accent2); color: #fff; }
  .meta { font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  .row.user .meta { color: #cfe0ff; text-align: right; }
  .bubble .files { margin-top: 6px; display: flex; flex-direction: column; gap: 6px; }
  .filecard {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    color: inherit; text-decoration: none; font-size: 13px;
  }
  .filecard img { max-width: 100%; border-radius: 8px; display: block; }
  .bubble img.inline { max-width: 100%; border-radius: 10px; margin-top: 6px; display: block; }
  .bubble pre {
    background: #0b0d12; border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; overflow-x: auto; font-size: 13px;
  }
  .bubble code { background: rgba(255,255,255,.08); padding: 1px 5px; border-radius: 5px; font-size: 13px; }
  .bubble pre code { background: none; padding: 0; }
  .bubble h1,.bubble h2,.bubble h3 { margin: 10px 0 5px; font-size: 17px; }
  .bubble ul { margin: 5px 0; padding-left: 22px; }
  .bubble a { word-break: break-all; }
  .typing { color: var(--dim); font-size: 13px; padding: 0 2px 8px; min-height: 20px; }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 12px; }
  .pending { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip {
    display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 9px;
    border-radius: 999px; background: var(--panel2); border: 1px solid var(--line);
  }
  .chip .x { border: 0; background: none; color: var(--dim); padding: 0 0 0 2px; }
  .chip.busy { color: var(--warn); }
  .inputrow { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; max-height: 132px; min-height: 42px; padding: 10px 12px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
    color: var(--text); font: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .iconbtn {
    height: 42px; min-width: 42px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--text); font-size: 18px;
  }
  .iconbtn.send { background: var(--accent); border-color: var(--accent); color: #fff; font-size: 15px; font-weight: 600; }
  .iconbtn:disabled { opacity: .5; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 6px; }
  #drop {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.55); color: #fff; font-size: 20px; z-index: 9; pointer-events: none;
  }
  #drop.on { display: flex; }
</style>
</head>
<body>
<div id="login">
  <div class="card">
    <h1>MineAgent</h1>
    <p>网页入口 · 输入名字进入（每个名字一个独立会话）</p>
    <input id="name" maxlength="24" placeholder="你的名字，如 jzk" autocomplete="username">
    <button id="enter">进入</button>
    <div class="err" id="loginerr"></div>
  </div>
</div>

<div id="chat">
  <header>
    <div class="title">MineAgent</div>
    <div class="who" id="who"></div>
    <span class="badge" id="role"></span>
    <button class="leave" id="leave">退出</button>
  </header>
  <div id="list"></div>
  <div class="typing" id="typing"></div>
  <footer>
    <div class="pending" id="pending"></div>
    <div class="inputrow">
      <button class="iconbtn" id="attach" title="添加文件">＋</button>
      <input type="file" id="file" multiple hidden>
      <textarea id="text" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行，可拖入文件/粘贴图片）"></textarea>
      <button class="iconbtn send" id="send">发送</button>
    </div>
    <div class="hint">支持发送/接收图片与文件 · /help 看命令 · 每个名字独立会话</div>
  </footer>
</div>
<div id="drop">松开上传文件</div>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  let token = localStorage.getItem('mineagent.token') || '';
  let me = localStorage.getItem('mineagent.name') || '';
  let admin = localStorage.getItem('mineagent.admin') === '1';
  let lastId = 0;
  let pending = [];   // 已上传待发送的文件
  let msgIds = new Set();
  let es = null;

  // ---------- 工具 ----------
  async function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers, { 'Authorization': 'Bearer ' + token });
    const res = await fetch(path, opts);
    let body = null;
    try { body = await res.json(); } catch (e) { /* 空响应 */ }
    if (res.status === 401) { logout(true); throw new Error('登录已失效，请重新进入'); }
    if (!res.ok) throw new Error((body && body.error) || ('HTTP ' + res.status));
    return body;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function fmtSize(n) {
    if (!n) return '';
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1048576).toFixed(1) + ' MB';
  }
  function fmtTime(ms) {
    const d = new Date(ms || Date.now());
    return d.toTimeString().slice(0, 5);
  }
  // 轻量 Markdown：标题/列表/加粗/行内码/围栏代码/链接。先转义再放行白名单结构。
  function md(src) {
    const blocks = [];
    src = String(src).replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
      blocks.push('<pre><code>' + esc(code.replace(/\n$/, '')) + '</code></pre>');
      return '\u0000' + (blocks.length - 1) + '\u0000';
    });
    const lines = src.split('\n');
    let out = [], list = null;
    const inline = (s) => esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[^"'>])(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    for (const raw of lines) {
      const line = raw.replace(/\u0000(\d+)\u0000/g, (m, i) => '\u0001' + i + '\u0001');
      const h = line.match(/^(#{1,3})\s+(.*)$/);
      const li = line.match(/^\s*[-*]\s+(.*)$/);
      if (h) { if (list) { out.push('</ul>'); list = null; } out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'); continue; }
      if (li) { if (!list) { out.push('<ul>'); list = true; } out.push('<li>' + inline(li[1]) + '</li>'); continue; }
      if (list) { out.push('</ul>'); list = null; }
      out.push(line.trim() === '' ? '<br>' : '<div>' + inline(line) + '</div>');
    }
    if (list) out.push('</ul>');
    return out.join('').replace(/\u0001(\d+)\u0001/g, (m, i) => blocks[+i]);
  }
  function scrollNearBottom() {
    const el = $('list');
    return el.scrollHeight - el.scrollTop - el.clientHeight < 140;
  }
  function toBottom() { $('list').scrollTop = $('list').scrollHeight; }

  // ---------- 渲染 ----------
  function fileBubble(f) {
    if (f.image) {
      return '<a class="filecard" href="' + esc(f.url) + '" target="_blank" rel="noopener">' +
        '<img src="' + esc(f.url) + '" alt="' + esc(f.name || '图片') + '"></a>';
    }
    return '<a class="filecard" href="' + esc(f.url) + '" download>' +
      '<span>📄</span><span>' + esc(f.name || '文件') + '</span>' +
      (f.size ? '<span style="color:var(--dim)">' + fmtSize(f.size) + '</span>' : '') + '</a>';
  }
  function renderMsg(m, prepend) {
    if (msgIds.has(m.id)) return;
    msgIds.add(m.id);
    const row = document.createElement('div');
    row.className = 'row ' + (m.role === 'user' ? 'user' : 'agent');
    let html = '<div class="bubble">';
    if (m.role === 'agent') html += '<div class="meta">MineAgent · ' + fmtTime(m.at) + '</div>';
    if (m.text) html += m.role === 'agent' ? md(m.text) : esc(m.text).replace(/\n/g, '<br>');
    if (m.files && m.files.length) {
      html += '<div class="files">' + m.files.map(fileBubble).join('') + '</div>';
    }
    html += '</div>';
    row.innerHTML = html;
    const list = $('list');
    if (prepend) list.prepend(row); else list.append(row);
    if (!prepend && scrollNearBottom()) toBottom();
  }

  // ---------- 登录 ----------
  async function doLogin(name) {
    $('enter').disabled = true;
    $('loginerr').textContent = '';
    try {
      const res = await fetch('/api/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name })
      });
      const body = await res.json().catch(() => null);
      if (!res.ok) throw new Error((body && body.error) || ('HTTP ' + res.status));
      token = body.token; me = body.name; admin = !!body.admin;
      localStorage.setItem('mineagent.token', token);
      localStorage.setItem('mineagent.name', me);
      localStorage.setItem('mineagent.admin', admin ? '1' : '0');
      startChat();
    } catch (e) {
      $('loginerr').textContent = e.message;
    } finally {
      $('enter').disabled = false;
    }
  }
  function logout(silent) {
    token = ''; me = ''; admin = false;
    localStorage.removeItem('mineagent.token');
    localStorage.removeItem('mineagent.name');
    localStorage.removeItem('mineagent.admin');
    if (es) { es.close(); es = null; }
    $('chat').style.display = 'none';
    $('login').style.display = 'flex';
    if (!silent) $('loginerr').textContent = '';
  }
  $('enter').onclick = () => doLogin($('name').value.trim());
  $('name').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('enter').click(); });
  $('leave').onclick = () => logout(false);

  // ---------- 聊天 ----------
  async function startChat() {
    $('login').style.display = 'none';
    $('chat').style.display = 'flex';
    $('who').textContent = me;
    $('role').textContent = admin ? '管理员' : '普通';
    $('role').className = 'badge' + (admin ? ' admin' : '');
    $('list').innerHTML = ''; msgIds.clear(); lastId = 0;
    await loadHistory();
    connectSSE();
    $('text').focus();
  }
  async function loadHistory() {
    try {
      const body = await api('/api/history');
      for (const m of body.messages || []) { lastId = Math.max(lastId, m.id); renderMsg(m); }
      toBottom();
    } catch (e) { $('typing').textContent = e.message; }
  }
  async function syncAfter() {
    try {
      const body = await api('/api/history?after=' + lastId);
      const list = body.messages || [];
      for (const m of list) { lastId = Math.max(lastId, m.id); renderMsg(m); }
    } catch (e) { /* 静默，SSE 仍会推 */ }
  }
  function connectSSE() {
    if (es) es.close();
    es = new EventSource('/api/events?token=' + encodeURIComponent(token));
    es.addEventListener('message', (ev) => {
      try {
        const data = JSON.parse(ev.data);
        if (data.type === 'message' && data.message) {
          lastId = Math.max(lastId, data.message.id);
          renderMsg(data.message);
          if (data.message.role === 'agent') setTyping(false);
        }
      } catch (e) { /* ignore */ }
    });
    es.onopen = () => { syncAfter(); };
  }

  // ---------- 发送 ----------
  function setTyping(on, text) { $('typing').textContent = on ? (text || 'MineAgent 正在输入…') : ''; }
  async function sendMsg() {
    const text = $('text').value.trim();
    if (!text && !pending.length) return;
    if (pending.some((p) => p.busy)) { setTyping(false); $('typing').textContent = '还有文件在上传，稍等'; return; }
    const files = pending.map((p) => p.file);
    $('send').disabled = true;
    try {
      await api('/api/send', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text, files: files })
      });
      $('text').value = ''; autoGrow();
      pending = []; renderPending();
      setTyping(true);
      setTimeout(() => setTyping(false), 120000);
    } catch (e) {
      $('typing').textContent = e.message;
      setTimeout(() => setTyping(false), 4000);
    } finally {
      $('send').disabled = false;
    }
  }
  $('send').onclick = sendMsg;
  $('text').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMsg(); }
  });
  function autoGrow() {
    const t = $('text');
    t.style.height = 'auto';
    t.style.height = Math.min(t.scrollHeight, 132) + 'px';
  }
  $('text').addEventListener('input', autoGrow);

  // ---------- 上传 ----------
  function renderPending() {
    const box = $('pending');
    box.innerHTML = '';
    pending.forEach((p, i) => {
      const chip = document.createElement('div');
      chip.className = 'chip' + (p.busy ? ' busy' : '');
      chip.innerHTML = '<span>' + esc(p.file.name) + (p.busy ? ' · 上传中…' : '') + '</span>';
      const x = document.createElement('button');
      x.className = 'x'; x.textContent = '✕';
      x.onclick = () => { pending.splice(i, 1); renderPending(); };
      if (!p.busy) chip.appendChild(x);
      box.appendChild(chip);
    });
  }
  async function addFiles(fileList) {
    for (const f of Array.from(fileList)) {
      if (f.size > 20 * 1024 * 1024) { alert('「' + f.name + '」超过 20MB 上限'); continue; }
      const item = { file: null, busy: true };
      pending.push(item); renderPending();
      try {
        const res = await fetch('/api/upload?name=' + encodeURIComponent(f.name), {
          method: 'POST', body: f,
          headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/octet-stream' }
        });
        const body = await res.json().catch(() => null);
        if (!res.ok) throw new Error((body && body.error) || ('HTTP ' + res.status));
        item.file = body; item.busy = false;
      } catch (e) {
        item.busy = false; item.err = true;
        pending.splice(pending.indexOf(item), 1);
        alert('上传失败：' + e.message);
      }
      renderPending();
    }
    $('text').focus();
  }
  $('attach').onclick = () => $('file').click();
  $('file').onchange = () => { addFiles($('file').files); $('file').value = ''; };
  document.addEventListener('paste', (e) => {
    if ($('chat').style.display === 'none') return;
    const files = e.clipboardData && e.clipboardData.files;
    if (files && files.length) { e.preventDefault(); addFiles(files); }
  });
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => { e.preventDefault(); if (++dragDepth === 1) $('drop').classList.add('on'); });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('drop').classList.remove('on'); } });
  window.addEventListener('drop', (e) => {
    e.preventDefault(); dragDepth = 0; $('drop').classList.remove('on');
    if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  // ---------- 启动 ----------
  if (token && me) {
    api('/api/me').then((res) => {
      admin = !!res.admin; me = res.name;
      localStorage.setItem('mineagent.admin', admin ? '1' : '0');
      startChat();
    }).catch(() => logout(true));
  } else {
    logout(true);
  }
})();
</script>
</body>
</html>
