name: MineAgent
version: '${version}'
main: com.mineagent.paper.MineAgentPlugin
api-version: '26.2'
description: MineAgent 后端连接插件（WebSocket）
author: jurky123
softdepend: [MineUI, WorldEdit]
commands:
  mineagent:
    description: MineAgent 状态、重连与操作审批
    usage: /mineagent <ui|status|reconnect|approve|deny> [审批ID]
    aliases: [ma]
  agent:
    description: 向 AI 助手提问（等价于聊天 @agent）
    usage: /agent [ui|dialog|问题]
    aliases: [ai]
permissions:
  mineagent.use:
    description: 允许打开助手界面与提问
    default: true
  mineagent.admin:
    description: 允许 /mineagent status|reconnect
    default: op
  mineagent.body:
    description: 允许关联已验证网页管理员并在本次游戏会话控制 AI 玩家
    default: op
  mineagent.approve:
    description: 允许批准/拒绝 MineAgent 的高权限操作
    default: op
  mineagent.teleport:
    description: 允许通过 MineAgent 请求传送（仍需管理员批准）
    default: op
  mineagent.give:
    description: 允许通过 MineAgent 请求给予物品（仍需管理员批准）
    default: op
