<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MineAgent</title>
<style>
  :root {
    --bg: #212121; --sidebar: #171717; --panel: #303030; --hover: #2f2f2f;
    --line: #333; --text: #ececec; --dim: #b4b4b4; --dim2: #8e8e8e;
    --accent: #fff; --ok: #4ade80; --warn: #e0a23f; --err: #ef4444;
    --radius: 26px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.7 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
      "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  a { color: #7ab7ff; }
  button { font: inherit; cursor: pointer; color: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #4a4a4a; border-radius: 4px; }

  /* ---------- 登录 ---------- */
  #login { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); }
  .login-card { width: 100%; max-width: 380px; text-align: center; }
  .logo {
    width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 50%;
    background: linear-gradient(135deg, #4f8cff, #8b5cf6); display: flex; align-items: center;
    justify-content: center; font-weight: 800; font-size: 24px; color: #fff;
  }
  .login-card h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; }
  .login-card p { margin: 0 0 22px; color: var(--dim); font-size: 14px; }
  .login-input {
    width: 100%; padding: 13px 16px; border-radius: 14px; border: 1px solid #444;
    background: var(--panel); color: var(--text); font: inherit; outline: none;
  }
  .login-input:focus { border-color: #777; }
  .login-btn {
    width: 100%; margin-top: 12px; padding: 13px; border: 0; border-radius: 14px;
    background: #ececec; color: #111; font-weight: 600;
  }
  .login-btn:disabled { opacity: .5; }
  .login-err { color: var(--err); font-size: 13px; min-height: 19px; margin-top: 10px; }

  /* ---------- 布局 ---------- */
  #app { display: none; height: 100%; }
  #sidebar {
    position: fixed; inset: 0 auto 0 0; width: 264px; background: var(--sidebar);
    border-right: 1px solid var(--line); display: flex; flex-direction: column; z-index: 20;
    transform: translateX(-100%); transition: transform .2s ease;
  }
  #sidebar.open { transform: none; }
  #backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 15; }
  #backdrop.on { display: block; }
  .side-top { padding: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 8px 10px 14px; font-weight: 600; }
  .brand .logo { width: 30px; height: 30px; font-size: 14px; margin: 0; border-radius: 8px; }
  .newchat {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: none; border: 1px solid var(--line); border-radius: 12px; font-size: 14px;
  }
  .newchat:hover { background: var(--hover); }
  .side-foot { margin-top: auto; padding: 12px; border-top: 1px solid var(--line); }
  .userrow { display: flex; align-items: center; gap: 10px; padding: 8px 6px; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%; flex: none; display: flex;
    align-items: center; justify-content: center; font-size: 13px; font-weight: 600;
    background: linear-gradient(135deg, #4f8cff, #8b5cf6); color: #fff;
  }
  .userrow .uname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim2); }
  .badge.admin { color: var(--ok); border-color: rgba(74,222,128,.4); }
  .logout { width: 100%; text-align: left; background: none; border: 0; color: var(--dim); font-size: 13px; padding: 8px 6px; border-radius: 8px; }
  .logout:hover { background: var(--hover); color: var(--text); }

  main { display: flex; flex-direction: column; height: 100%; }
  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    position: sticky; top: 0; z-index: 5;
  }
  .menu { display: none; background: none; border: 0; font-size: 20px; padding: 4px 8px; border-radius: 8px; }
  .menu:hover { background: var(--hover); }
  header .title { font-weight: 600; font-size: 15px; }
  header .sub { color: var(--dim2); font-size: 13px; flex: 1; }

  #list { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  #listInner { max-width: 768px; margin: 0 auto; padding: 12px 20px 40px; }
  .empty { padding: 12vh 0 0; text-align: center; }
  .empty h2 { font-weight: 600; font-size: 26px; margin: 0 0 26px; }
  .suggests { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .suggests button {
    background: none; border: 1px solid var(--line); border-radius: 999px;
    padding: 9px 16px; font-size: 14px; color: var(--dim);
  }
  .suggests button:hover { background: var(--hover); color: var(--text); }

  .msg { padding: 14px 0; display: flex; gap: 14px; }
  .msg .avatar { width: 30px; height: 30px; margin-top: 2px; }
  .msg .body { min-width: 0; flex: 1; }
  .msg.user { justify-content: flex-end; }
  .msg.user .body { flex: none; max-width: 82%; display: flex; flex-direction: column; align-items: flex-end; }
  .msg.user .content { background: var(--panel); border-radius: 20px; padding: 10px 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.assistant .content { overflow-wrap: anywhere; }
  .msg .meta { font-size: 12px; color: var(--dim2); margin-bottom: 2px; }
  .msg .actions { opacity: 0; transition: opacity .15s; margin-top: 4px; }
  .msg:hover .actions { opacity: 1; }
  .act {
    background: none; border: 0; color: var(--dim2); font-size: 12px; padding: 3px 8px;
    border-radius: 6px; display: inline-flex; align-items: center; gap: 4px;
  }
  .act:hover { background: var(--hover); color: var(--text); }

  .content pre {
    position: relative; background: #0d0d0d; border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; overflow-x: auto; font-size: 13.5px; margin: 10px 0;
  }
  .content code { background: rgba(255,255,255,.09); padding: 1px 5px; border-radius: 5px; font-size: 13.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .content pre code { background: none; padding: 0; }
  .codecopy {
    position: absolute; top: 6px; right: 6px; font-size: 11px; padding: 2px 8px;
    border-radius: 6px; border: 1px solid var(--line); background: #1a1a1a; color: var(--dim);
  }
  .codecopy:hover { color: var(--text); }
  .content h1, .content h2, .content h3 { margin: 14px 0 6px; font-weight: 600; }
  .content h1 { font-size: 20px; } .content h2 { font-size: 18px; } .content h3 { font-size: 16px; }
  .content ul { margin: 6px 0; padding-left: 24px; }
  .content li { margin: 2px 0; }
  .content > div:empty { height: 8px; }

  .files { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .imgbox { position: relative; max-width: 340px; border-radius: 12px; overflow: hidden; }
  .imgbox img { width: 100%; border-radius: 12px; border: 1px solid var(--line); display: block; cursor: zoom-in; }
  .imgtools {
    position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; opacity: 0; transition: opacity .15s;
  }
  .imgbox:hover .imgtools { opacity: 1; }
  .itool {
    width: 30px; height: 30px; border-radius: 8px; border: 0; display: flex; align-items: center;
    justify-content: center; background: rgba(0,0,0,.65); color: #fff; backdrop-filter: blur(4px);
    text-decoration: none; padding: 0;
  }
  .itool:hover { background: rgba(0,0,0,.85); }
  .filecard {
    display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 14px;
    background: var(--bg); border: 1px solid var(--line); color: inherit; text-decoration: none;
    font-size: 14px; max-width: 360px;
  }
  .filecard:hover { background: var(--hover); }
  .ext {
    width: 38px; height: 38px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
    flex: none; font-size: 10px; font-weight: 700; letter-spacing: .3px; color: #fff; background: #555;
  }
  .ext.pdf { background: #c0392b; } .ext.doc { background: #2b6cb0; } .ext.xls { background: #2f855a; }
  .ext.ppt { background: #c05621; } .ext.zip { background: #975a16; } .ext.img { background: #6b46c1; }
  .ext.audio { background: #b83280; } .ext.video { background: #4c51bf; } .ext.code { background: #2c7a7b; }
  .ext.txt { background: #4a5568; }
  .filecard .fmeta { min-width: 0; flex: 1; }
  .filecard .fname { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .filecard .fsize { color: var(--dim2); font-size: 12px; }
  .filecard .fdl { color: var(--dim2); flex: none; display: flex; }
  .filecard:hover .fdl { color: var(--text); }

  .typing .dots span {
    display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%;
    background: var(--dim); animation: blink 1.2s infinite both;
  }
  .typing .dots span:nth-child(2) { animation-delay: .2s; }
  .typing .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }

  #tobottom {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 148px;
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--panel); display: none; align-items: center; justify-content: center; z-index: 6;
  }
  #tobottom.on { display: flex; }

  .composer { padding: 0 20px calc(10px + env(safe-area-inset-bottom)); }
  .composer .inner { max-width: 768px; margin: 0 auto; }
  #pending { display: flex; flex-wrap: wrap; gap: 10px; padding-bottom: 8px; }
  #pending:empty { display: none; }
  .chip {
    position: relative; width: 72px; height: 72px; border-radius: 14px; overflow: hidden;
    border: 1px solid var(--line); background: var(--panel); flex: none;
  }
  .chip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .chip .doc { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px; }
  .chip .doc .n { font-size: 10px; color: var(--dim); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .x {
    position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%;
    border: 0; background: rgba(0,0,0,.7); color: #fff; font-size: 12px; line-height: 1; padding: 0;
  }
  .chip .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: #fff; width: 0; transition: width .15s; }
  .chip.done .bar { background: var(--ok); }
  .chip .note { position: absolute; left: 0; right: 0; bottom: 3px; font-size: 9px; text-align: center; color: var(--ok); }
  .box {
    display: flex; align-items: flex-end; gap: 6px; background: var(--panel);
    border-radius: var(--radius); padding: 8px 8px 8px 8px; border: 1px solid transparent;
  }
  .box:focus-within { border-color: #555; }
  .box textarea {
    flex: 1; resize: none; border: 0; outline: none; background: none; color: var(--text);
    font: inherit; max-height: 200px; min-height: 28px; padding: 8px 4px;
  }
  .box textarea::placeholder { color: var(--dim2); }
  .iconbtn {
    width: 36px; height: 36px; border-radius: 50%; border: 0; background: none;
    display: flex; align-items: center; justify-content: center; flex: none; color: var(--dim);
    font-size: 20px;
  }
  .iconbtn:hover { background: var(--hover); color: var(--text); }
  .iconbtn.send { background: #4d4d4d; color: #a8a8a8; transition: all .15s; }
  .iconbtn.send.ready { background: #ececec; color: #111; }
  .iconbtn.send.ready:hover { background: #fff; }
  .hint { text-align: center; color: var(--dim2); font-size: 12px; margin-top: 8px; }
  /* ---------- + 菜单 / Workspace 弹层 ---------- */
  .composer .inner { position: relative; }
  #plusmenu {
    position: absolute; left: 0; bottom: calc(100% + 8px); width: 330px; max-width: calc(100vw - 24px);
    max-height: min(62vh, 520px); overflow-y: auto; background: #262626; border: 1px solid var(--line);
    border-radius: 16px; padding: 8px; box-shadow: 0 12px 36px rgba(0,0,0,.45); display: none; z-index: 12;
  }
  #plusmenu.on { display: block; }
  .pm-sec { padding: 6px 4px; }
  .pm-sec + .pm-sec { border-top: 1px solid var(--line); }
  .pm-title { font-size: 12px; color: var(--dim2); padding: 4px 8px 6px; display: flex; justify-content: space-between; }
  .pm-item {
    display: flex; flex-direction: column; align-items: flex-start; gap: 1px; width: 100%;
    background: none; border: 0; text-align: left; padding: 8px 10px; border-radius: 10px; font-size: 14px;
  }
  .pm-item:hover { background: var(--hover); }
  .pm-desc { font-size: 12px; color: var(--dim2); }
  .pm-filter {
    width: calc(100% - 16px); margin: 0 8px 6px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; outline: none; font-size: 13px;
  }
  .pm-list { max-height: 190px; overflow-y: auto; }
  .pm-item.model { flex-direction: row; align-items: center; justify-content: space-between; }
  .pm-check { color: var(--ok); font-size: 13px; visibility: hidden; }
  .pm-item.model.on .pm-check { visibility: visible; }
  .pm-chips { display: flex; gap: 6px; padding: 0 8px; flex-wrap: wrap; }
  .pm-chip {
    border: 1px solid var(--line); background: none; border-radius: 999px; padding: 5px 14px; font-size: 13px; color: var(--dim);
  }
  .pm-chip:hover { background: var(--hover); color: var(--text); }
  .pm-chip.on { background: #ececec; border-color: #ececec; color: #111; font-weight: 600; }

  #wsmodal {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center;
    justify-content: center; z-index: 35; padding: 20px;
  }
  #wsmodal.on { display: flex; }
  .ws-card {
    width: 100%; max-width: 640px; max-height: 78vh; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
  }
  .ws-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .ws-path { flex: 1; font-size: 13px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-path a { color: var(--dim); text-decoration: none; }
  .ws-path a:hover { color: var(--text); text-decoration: underline; }
  .ws-list { overflow-y: auto; padding: 6px; }
  .ws-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px;
    color: inherit; text-decoration: none; font-size: 14px; cursor: pointer; border: 0; background: none; width: 100%; text-align: left;
  }
  .ws-row:hover { background: var(--hover); }
  .ws-row .ws-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-row .ws-size { color: var(--dim2); font-size: 12px; }
  .ws-empty { color: var(--dim2); font-size: 13px; text-align: center; padding: 24px; }

  #drop {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.6); color: #fff; font-size: 18px; z-index: 30; pointer-events: none;
  }
  #drop.on { display: flex; }
  /* ---------- 图片查看器（ChatGPT 风格） ---------- */
  #viewer { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; z-index: 40; flex-direction: column; }
  #viewer.on { display: flex; }
  .vbar {
    display: flex; align-items: center; gap: 6px; padding: 10px 14px; color: #eee;
    background: linear-gradient(rgba(0,0,0,.5), transparent);
  }
  .vname { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; color: #ddd; }
  .vcount { color: #999; font-size: 12px; flex: 1; }
  .vbtn {
    height: 32px; min-width: 32px; padding: 0 10px; border-radius: 8px; border: 0;
    background: rgba(255,255,255,.12); color: #eee; display: flex; align-items: center;
    justify-content: center; font-size: 13px; text-decoration: none; gap: 5px;
  }
  .vbtn:hover { background: rgba(255,255,255,.24); }
  .vzoom { min-width: 46px; text-align: center; font-size: 12px; color: #bbb; }
  .vstage { flex: 1; position: relative; overflow: hidden; touch-action: none; display: flex; align-items: center; justify-content: center; }
  .vimg { max-width: 100%; max-height: 100%; border-radius: 4px; user-select: none; -webkit-user-drag: none; transform-origin: center center; cursor: grab; }
  .vimg.grabbing { cursor: grabbing; }
  .vnav {
    position: absolute; top: 50%; transform: translateY(-50%); width: 42px; height: 60px; border: 0;
    border-radius: 10px; background: rgba(255,255,255,.1); color: #fff; font-size: 26px; line-height: 1;
  }
  .vnav:hover { background: rgba(255,255,255,.24); }
  .vnav.prev { left: 14px; } .vnav.next { right: 14px; }
  .vmeta { padding: 8px 14px 14px; color: #999; font-size: 12px; text-align: center; }
  @media (max-width: 640px) { .vname { max-width: 34vw; } .vnav { width: 34px; height: 48px; font-size: 20px; } }

  @media (min-width: 900px) {
    #sidebar { transform: none; }
    main { margin-left: 264px; }
    .menu { display: none; }
    #backdrop { display: none !important; }
  }
  @media (max-width: 899px) {
    .menu { display: block; }
    #listInner { padding: 8px 14px 30px; }
    .composer { padding-left: 12px; padding-right: 12px; }
    .msg.user .body { max-width: 88%; }
  }
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="logo">M</div>
    <h1>MineAgent</h1>
    <p>输入名字进入 · 每个名字一个独立会话</p>
    <input id="name" class="login-input" maxlength="24" placeholder="你的名字，如 jzk" autocomplete="username">
    <button id="enter" class="login-btn">进入</button>
    <div class="login-err" id="loginerr"></div>
  </div>
</div>

<div id="app">
  <aside id="sidebar">
    <div class="side-top">
      <div class="brand"><div class="logo">M</div>MineAgent</div>
      <button class="newchat" id="newchat">✎&nbsp; 新会话</button>
    </div>
    <div class="side-foot">
      <div class="userrow">
        <div class="avatar" id="myavatar">?</div>
        <div class="uname" id="myname"></div>
        <span class="badge" id="myrole"></span>
      </div>
      <button class="logout" id="logout">退出登录</button>
    </div>
  </aside>
  <div id="backdrop"></div>

  <main>
    <header>
      <button class="menu" id="menu">☰</button>
      <div class="title">MineAgent</div>
      <div class="sub">网页入口 · /help 看命令</div>
    </header>
    <div id="list">
      <div id="listInner">
        <div class="empty" id="empty">
          <h2>有什么可以帮你？</h2>
          <div class="suggests">
            <button data-q="看看服务器现在在线有谁">查在线玩家</button>
            <button data-q="服务器状态怎么样，卡不卡？">服务器状态</button>
            <button data-q="用 PIL 画一张今天的时间线示意图，然后发给我">画张图发我</button>
            <button data-q="/help">看看命令</button>
          </div>
        </div>
      </div>
    </div>
    <button id="tobottom">↓</button>
    <div class="composer">
      <div class="inner">
        <div id="pending"></div>
        <div id="plusmenu">
          <div class="pm-sec">
            <button class="pm-item" id="pm-upload"><span>上传图片 / 文件</span><span class="pm-desc">也可以拖拽或直接粘贴</span></button>
          </div>
          <div class="pm-sec" id="pm-skills">
            <div class="pm-title">技能</div>
          </div>
          <div class="pm-sec" id="pm-tools">
            <div class="pm-title">工具</div>
            <button class="pm-item" id="pm-ws"><span>查看 Workspace</span><span class="pm-desc">浏览 / 下载 agent 的文件（管理员）</span></button>
          </div>
          <div class="pm-sec">
            <div class="pm-title"><span>模型</span><span id="pm-model-cur"></span></div>
            <input class="pm-filter" id="pm-modelfilter" placeholder="筛选模型…">
            <div class="pm-list" id="pm-models"></div>
          </div>
          <div class="pm-sec">
            <div class="pm-title">思考强度</div>
            <div class="pm-chips" id="pm-efforts"></div>
          </div>
        </div>
        <div class="box">
          <button class="iconbtn" id="attach" title="添加文件">＋</button>
          <input type="file" id="file" multiple hidden>
          <textarea id="text" rows="1" placeholder="给 MineAgent 发消息"></textarea>
          <button class="iconbtn send" id="send" title="发送">↑</button>
        </div>
        <div class="hint">可拖拽/粘贴文件与图片（图片会自动压缩）· Enter 发送，Shift+Enter 换行</div>
      </div>
    </div>
  </main>
</div>
<div id="wsmodal">
  <div class="ws-card">
    <div class="ws-head">
      <div class="ws-path" id="ws-path"></div>
      <button class="vbtn" id="ws-refresh" title="刷新">↻</button>
      <button class="vbtn" id="ws-close" title="关闭">✕</button>
    </div>
    <div class="ws-list" id="ws-list"></div>
  </div>
</div>
<div id="drop">松开上传文件</div>
<div id="viewer">
  <div class="vbar">
    <span class="vname"></span>
    <span class="vcount"></span>
    <button class="vbtn" data-act="zoomout" title="缩小">−</button>
    <span class="vzoom">100%</span>
    <button class="vbtn" data-act="zoomin" title="放大">＋</button>
    <button class="vbtn" data-act="reset" title="原始大小">1:1</button>
    <a class="vbtn vdl" download title="下载">下载</a>
    <button class="vbtn" data-act="close" title="关闭（Esc）">✕</button>
  </div>
  <div class="vstage">
    <button class="vnav prev" title="上一张（←）">‹</button>
    <img class="vimg" alt="">
    <button class="vnav next" title="下一张（→）">›</button>
  </div>
  <div class="vmeta">滚轮/双指缩放 · 拖动平移 · Esc 关闭</div>
</div>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  let token = localStorage.getItem('mineagent.token') || '';
  let me = localStorage.getItem('mineagent.name') || '';
  let admin = localStorage.getItem('mineagent.admin') === '1';
  let lastId = 0;
  let pending = [];          // {file, name, progress, done, note, url}
  let msgIds = new Set();
  let es = null;
  let waiting = false;

  // ---------- 基础 ----------
  async function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers, { 'Authorization': 'Bearer ' + token });
    const res = await fetch(path, opts);
    let body = null;
    try { body = await res.json(); } catch (e) { /* 空响应 */ }
    if (res.status === 401) { logout(true); throw new Error('登录已失效，请重新进入'); }
    if (!res.ok) throw new Error((body && body.error) || ('HTTP ' + res.status));
    return body;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  // 附件 URL 兜底拼 token：cookie 没种上/被浏览器拦时 <img>、下载也能用。
  function withTok(u) {
    if (!u || u.startsWith('blob:') || u.startsWith('data:')) return u;
    return u + (u.indexOf('?') >= 0 ? '&' : '?') + 'token=' + encodeURIComponent(token);
  }
  function fmtSize(n) {
    if (!n && n !== 0) return '';
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1048576).toFixed(1) + ' MB';
  }
  function fmtTime(ms) {
    const d = new Date(ms || Date.now());
    return d.toTimeString().slice(0, 5);
  }
  // 轻量 Markdown：围栏代码/标题/列表/加粗/行内码/链接
  function renderContent(el, text) {
    // 先把代码块抽出来（多行安全），再逐行处理其余文本，占位符不会跟行号冲突。
    const blocks = [];
    const src = String(text).replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
      blocks.push('<pre><code>' + esc(code.replace(/\n$/, '')) + '</code></pre>');
      return '\u0000' + (blocks.length - 1) + '\u0000';
    });
    const inline = (s) => esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[^"'>])(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    const lines = src.split('\n');
    let out = [], list = null;
    const flushList = () => { if (list) { out.push('</ul>'); list = null; } };
    for (const raw of lines) {
      if (/^\u0000\d+\u0000$/.test(raw.trim())) { flushList(); out.push(raw.trim()); continue; }
      const h = raw.match(/^(#{1,3})\s+(.*)$/);
      const li = raw.match(/^\s*[-*]\s+(.*)$/);
      if (h) { flushList(); out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'); continue; }
      if (li) { if (!list) { out.push('<ul>'); list = true; } out.push('<li>' + inline(li[1]) + '</li>'); continue; }
      flushList();
      out.push(raw.trim() === '' ? '<div></div>' : '<div>' + inline(raw) + '</div>');
    }
    flushList();
    el.innerHTML = out.join('').replace(/\u0000(\d+)\u0000/g, (m, i) => blocks[+i]);
  }
  function scrollNearBottom() {
    const el = $('list');
    return el.scrollHeight - el.scrollTop - el.clientHeight < 160;
  }
  function toBottom() { const el = $('list'); el.scrollTop = el.scrollHeight; updateToBottom(); }
  function updateToBottom() {
    const el = $('list');
    $('tobottom').classList.toggle('on', el.scrollHeight - el.scrollTop - el.clientHeight > 320);
  }
  $('list').addEventListener('scroll', updateToBottom);
  $('tobottom').onclick = toBottom;

  // ---------- 消息渲染 ----------
  const ICON_DOWNLOAD = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>';
  const ICON_EXPAND = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H3v6"/><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M15 21h6v-6"/></svg>';
  // 按扩展名给文件卡片配色 + 角标（ChatGPT 风格的文件类型图标）
  function extInfo(name) {
    const ext = (String(name || '').split('.').pop() || '').toLowerCase();
    const map = {
      pdf: ['PDF', 'pdf'], doc: ['DOC', 'doc'], docx: ['DOC', 'doc'], rtf: ['RTF', 'doc'],
      xls: ['XLS', 'xls'], xlsx: ['XLS', 'xls'], csv: ['CSV', 'xls'],
      ppt: ['PPT', 'ppt'], pptx: ['PPT', 'ppt'],
      txt: ['TXT', 'txt'], md: ['MD', 'txt'], log: ['LOG', 'txt'],
      json: ['JSON', 'code'], js: ['JS', 'code'], ts: ['TS', 'code'], py: ['PY', 'code'],
      java: ['JAVA', 'code'], go: ['GO', 'code'], sh: ['SH', 'code'], html: ['HTML', 'code'],
      css: ['CSS', 'code'], xml: ['XML', 'code'], yml: ['YML', 'code'], yaml: ['YML', 'code'],
      zip: ['ZIP', 'zip'], rar: ['RAR', 'zip'], '7z': ['7Z', 'zip'], tar: ['TAR', 'zip'], gz: ['GZ', 'zip'],
      mp3: ['MP3', 'audio'], wav: ['WAV', 'audio'], m4a: ['M4A', 'audio'], flac: ['FLAC', 'audio'],
      mp4: ['MP4', 'video'], mov: ['MOV', 'video'], mkv: ['MKV', 'video'], webm: ['WEBM', 'video']
    };
    if (map[ext]) return map[ext];
    return [ext ? ext.slice(0, 4).toUpperCase() : 'FILE', 'txt'];
  }
  function fileBubble(f) {
    const name = f.name || '文件';
    if (f.image) {
      const src = withTok(f.url);
      return '<div class="imgbox"><img src="' + esc(src) + '" alt="' + esc(name) +
        '" loading="lazy" data-zoom="' + esc(src) + '" data-name="' + esc(name) + '">' +
        '<div class="imgtools">' +
        '<button class="itool" data-preview title="查看">' + ICON_EXPAND + '</button>' +
        '<a class="itool" href="' + esc(src) + '" download="' + esc(name) + '" title="下载">' + ICON_DOWNLOAD + '</a>' +
        '</div></div>';
    }
    const [label, cls] = extInfo(name);
    return '<a class="filecard" href="' + esc(withTok(f.url)) + '" download="' + esc(name) + '" title="' + esc(name) + '">' +
      '<span class="ext ' + cls + '">' + label + '</span>' +
      '<span class="fmeta"><span class="fname">' + esc(name) + '</span>' +
      (f.size ? '<span class="fsize">' + fmtSize(f.size) + '</span>' : '') + '</span>' +
      '<span class="fdl">' + ICON_DOWNLOAD + '</span></a>';
  }
  function addCodeCopy(row) {
    row.querySelectorAll('pre').forEach((pre) => {
      const btn = document.createElement('button');
      btn.className = 'codecopy';
      btn.textContent = '复制';
      btn.onclick = () => {
        const code = pre.querySelector('code');
        navigator.clipboard.writeText(code ? code.textContent : '').then(() => {
          btn.textContent = '已复制'; setTimeout(() => { btn.textContent = '复制'; }, 1200);
        });
      };
      pre.appendChild(btn);
    });
  }
  function renderMsg(m) {
    if (msgIds.has(m.id)) return;
    msgIds.add(m.id);
    const row = document.createElement('div');
    row.className = 'msg ' + (m.role === 'user' ? 'user' : 'assistant');
    row.dataset.raw = m.text || '';
    let html = '';
    if (m.role === 'assistant') {
      html += '<div class="avatar">M</div><div class="body">' +
        '<div class="meta">MineAgent · ' + fmtTime(m.at) + '</div><div class="content"></div>' +
        (m.files && m.files.length ? '<div class="files">' + m.files.map(fileBubble).join('') + '</div>' : '') +
        '<div class="actions"><button class="act copy">⧉ 复制</button></div></div>';
    } else {
      html += '<div class="body">' +
        '<div class="content bubble"></div>' +
        (m.files && m.files.length ? '<div class="files">' + m.files.map(fileBubble).join('') + '</div>' : '') +
        '</div>';
    }
    row.innerHTML = html;
    const content = row.querySelector('.content');
    if (content) {
      if (m.role === 'assistant') renderContent(content, m.text || '');
      else content.textContent = m.text || '';
    }
    const copy = row.querySelector('.copy');
    if (copy) copy.onclick = () => {
      navigator.clipboard.writeText(row.dataset.raw).then(() => {
        copy.textContent = '✓ 已复制'; setTimeout(() => { copy.textContent = '⧉ 复制'; }, 1200);
      });
    };
    addCodeCopy(row);
    const nearBottom = scrollNearBottom();
    $('listInner').appendChild(row);
    $('empty').style.display = 'none';
    if (nearBottom) toBottom(); else updateToBottom();
  }
  function clearMessages() {
    $('listInner').querySelectorAll('.msg,.typing').forEach((n) => n.remove());
    msgIds.clear(); lastId = 0;
    $('empty').style.display = '';
    setTyping(false);
  }
  function setTyping(on) {
    waiting = on;
    const old = $('listInner').querySelector('.typing');
    if (!on) { if (old) old.remove(); return; }
    if (old) return;
    const row = document.createElement('div');
    row.className = 'msg assistant typing';
    row.innerHTML = '<div class="avatar">M</div><div class="body"><div class="content">' +
      '<span class="dots"><span></span><span></span><span></span></span> 正在输入…</div></div>';
    $('listInner').appendChild(row);
    if (scrollNearBottom()) toBottom();
  }

  // ---------- 图片查看器 ----------
  const viewer = { list: [], index: 0, scale: 1, x: 0, y: 0, drag: false, sx: 0, sy: 0, ox: 0, oy: 0 };
  const V = () => $('viewer');
  function openViewer(list, index) {
    if (!list || !list.length) return;
    viewer.list = list;
    viewer.index = Math.max(0, Math.min(index || 0, list.length - 1));
    V().classList.add('on');
    document.body.style.overflow = 'hidden';
    showViewerImage();
  }
  function closeViewer() { V().classList.remove('on'); viewer.list = []; document.body.style.overflow = ''; }
  function showViewerImage() {
    const it = viewer.list[viewer.index] || {};
    const img = V().querySelector('.vimg');
    img.src = it.url; img.alt = it.name || '';
    V().querySelector('.vname').textContent = it.name || '';
    V().querySelector('.vcount').textContent = viewer.list.length > 1 ? (viewer.index + 1) + ' / ' + viewer.list.length : '';
    const many = viewer.list.length > 1;
    V().querySelector('.vnav.prev').style.visibility = many ? 'visible' : 'hidden';
    V().querySelector('.vnav.next').style.visibility = many ? 'visible' : 'hidden';
    const dl = V().querySelector('.vdl');
    dl.href = it.url || '';
    if (it.name) dl.setAttribute('download', it.name); else dl.removeAttribute('download');
    resetZoom();
  }
  function applyZoom() {
    V().querySelector('.vimg').style.transform =
      'translate(' + viewer.x + 'px,' + viewer.y + 'px) scale(' + viewer.scale + ')';
    V().querySelector('.vzoom').textContent = Math.round(viewer.scale * 100) + '%';
  }
  function resetZoom() { viewer.scale = 1; viewer.x = 0; viewer.y = 0; applyZoom(); }
  function zoomBy(f, cx, cy) {
    const ns = Math.min(8, Math.max(0.1, viewer.scale * f));
    const stage = V().querySelector('.vstage');
    const r = stage.getBoundingClientRect();
    const px = (cx === undefined ? r.width / 2 : cx - r.left) - r.width / 2;
    const py = (cy === undefined ? r.height / 2 : cy - r.top) - r.height / 2;
    const k = ns / viewer.scale;
    viewer.x = px - (px - viewer.x) * k;
    viewer.y = py - (py - viewer.y) * k;
    viewer.scale = ns;
    applyZoom();
  }
  function stepViewer(d) {
    if (viewer.list.length < 2) return;
    viewer.index = (viewer.index + d + viewer.list.length) % viewer.list.length;
    showViewerImage();
  }
  (function bindViewer() {
    const stage = V().querySelector('.vstage');
    stage.addEventListener('wheel', (e) => { e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY); }, { passive: false });
    stage.addEventListener('dblclick', (e) => { e.preventDefault(); viewer.scale > 1.01 ? resetZoom() : zoomBy(2, e.clientX, e.clientY); });
    stage.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.vnav')) return;
      viewer.drag = true; viewer.sx = e.clientX; viewer.sy = e.clientY;
      viewer.ox = viewer.x; viewer.oy = viewer.y;
      V().querySelector('.vimg').classList.add('grabbing');
      try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    });
    stage.addEventListener('pointermove', (e) => {
      if (!viewer.drag) return;
      viewer.x = viewer.ox + (e.clientX - viewer.sx);
      viewer.y = viewer.oy + (e.clientY - viewer.sy);
      applyZoom();
    });
    const endDrag = (e) => { viewer.drag = false; V().querySelector('.vimg').classList.remove('grabbing'); try { stage.releasePointerCapture(e.pointerId); } catch (err) {} };
    stage.addEventListener('pointerup', endDrag);
    stage.addEventListener('pointercancel', endDrag);
    // 触屏双指缩放
    let pinch = 0;
    const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    stage.addEventListener('touchstart', (e) => { if (e.touches.length === 2) pinch = dist(e.touches); }, { passive: true });
    stage.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && pinch) {
        e.preventDefault();
        const d = dist(e.touches);
        zoomBy(d / pinch, (e.touches[0].clientX + e.touches[1].clientX) / 2, (e.touches[0].clientY + e.touches[1].clientY) / 2);
        pinch = d;
      }
    }, { passive: false });
    stage.addEventListener('touchend', () => { pinch = 0; });
    V().querySelector('.vbar').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const act = btn.dataset.act;
      if (act === 'zoomin') zoomBy(1.25);
      else if (act === 'zoomout') zoomBy(1 / 1.25);
      else if (act === 'reset') resetZoom();
      else if (act === 'close') closeViewer();
    });
    V().querySelector('.vnav.prev').onclick = () => stepViewer(-1);
    V().querySelector('.vnav.next').onclick = () => stepViewer(1);
    V().addEventListener('click', (e) => {
      // 点图片以外的空白（遮罩/舞台）关闭；点图不关。
      if (e.target === V() || e.target === stage) closeViewer();
    });
    document.addEventListener('keydown', (e) => {
      if (!V().classList.contains('on')) return;
      if (e.key === 'Escape') closeViewer();
      else if (e.key === 'ArrowLeft') stepViewer(-1);
      else if (e.key === 'ArrowRight') stepViewer(1);
      else if (e.key === '+' || e.key === '=') zoomBy(1.25);
      else if (e.key === '-') zoomBy(1 / 1.25);
      else if (e.key === '0') resetZoom();
    });
  })();
  // 点击消息里的图片（或"查看"按钮）打开查看器，同一条消息的多张图可左右切换
  $('list').addEventListener('click', (e) => {
    const hit = e.target.closest('img[data-zoom],[data-preview]');
    if (!hit) return;
    const row = e.target.closest('.msg');
    if (!row) return;
    const imgs = Array.from(row.querySelectorAll('img[data-zoom]'));
    if (!imgs.length) return;
    const target = hit.tagName === 'IMG' ? hit : hit.closest('.imgbox').querySelector('img[data-zoom]');
    const idx = Math.max(0, imgs.indexOf(target));
    openViewer(imgs.map((n) => ({ url: n.dataset.zoom, name: n.dataset.name || '' })), idx);
  });

  // ---------- 登录 ----------
  async function doLogin(name) {
    $('enter').disabled = true;
    $('loginerr').textContent = '';
    try {
      const res = await fetch('/api/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name })
      });
      const body = await res.json().catch(() => null);
      if (!res.ok) throw new Error((body && body.error) || ('HTTP ' + res.status));
      token = body.token; me = body.name; admin = !!body.admin;
      localStorage.setItem('mineagent.token', token);
      localStorage.setItem('mineagent.name', me);
      localStorage.setItem('mineagent.admin', admin ? '1' : '0');
      startChat();
    } catch (e) {
      $('loginerr').textContent = e.message;
    } finally {
      $('enter').disabled = false;
    }
  }
  function logout(silent) {
    token = ''; me = ''; admin = false;
    localStorage.removeItem('mineagent.token');
    localStorage.removeItem('mineagent.name');
    localStorage.removeItem('mineagent.admin');
    if (es) { es.close(); es = null; }
    clearMessages();
    $('app').style.display = 'none';
    $('login').style.display = 'flex';
    if (!silent) $('loginerr').textContent = '';
  }
  $('enter').onclick = () => doLogin($('name').value.trim());
  $('name').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('enter').click(); });
  $('logout').onclick = () => {
    fetch('/api/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } }).catch(() => {});
    logout(false);
  };

  // ---------- 会话 ----------
  async function startChat() {
    $('login').style.display = 'none';
    $('app').style.display = 'block';
    $('myname').textContent = me;
    $('myavatar').textContent = (me[0] || '?').toUpperCase();
    $('myrole').textContent = admin ? '管理员' : '普通';
    $('myrole').className = 'badge' + (admin ? ' admin' : '');
    clearMessages();
    await loadHistory();
    connectSSE();
    loadOptions(true).catch(() => {});
    closeSidebar();
    $('text').focus();
  }
  async function loadHistory() {
    try {
      const body = await api('/api/history');
      for (const m of body.messages || []) { lastId = Math.max(lastId, m.id); renderMsg(m); }
      if ((body.messages || []).length) toBottom();
    } catch (e) { showError(e.message); }
  }
  async function syncAfter() {
    try {
      const body = await api('/api/history?after=' + lastId);
      for (const m of body.messages || []) { lastId = Math.max(lastId, m.id); renderMsg(m); }
    } catch (e) { /* SSE 会推 */ }
  }
  function connectSSE() {
    if (es) es.close();
    es = new EventSource('/api/events?token=' + encodeURIComponent(token));
    es.addEventListener('message', (ev) => {
      try {
        const data = JSON.parse(ev.data);
        if (data.type === 'message' && data.message) {
          lastId = Math.max(lastId, data.message.id);
          renderMsg(data.message);
          if (data.message.role === 'agent') setTyping(false);
        } else if (data.type === 'cleared') {
          clearMessages();
        }
      } catch (e) { /* ignore */ }
    });
    es.onopen = () => syncAfter();
  }
  $('newchat').onclick = async () => {
    if ($('listInner').querySelectorAll('.msg').length && !confirm('开始新会话？当前对话记录和记忆会被清空。')) return;
    try { await api('/api/clear', { method: 'POST' }); clearMessages(); closeSidebar(); $('text').focus(); }
    catch (e) { showError(e.message); }
  };

  // ---------- 弹层 ----------
  function showError(msg) { setTyping(false); const t = $('listInner'); let n = t.querySelector('.errline'); if (!n) { n = document.createElement('div'); n.className = 'hint errline'; t.appendChild(n); } n.textContent = msg; setTimeout(() => n.remove(), 5000); }
  function openSidebar() { $('sidebar').classList.add('open'); $('backdrop').classList.add('on'); }
  function closeSidebar() { $('sidebar').classList.remove('open'); $('backdrop').classList.remove('on'); }
  $('menu').onclick = () => $('sidebar').classList.contains('open') ? closeSidebar() : openSidebar();
  $('backdrop').onclick = closeSidebar;

  // ---------- 输入 ----------
  function autoGrow() {
    const t = $('text');
    t.style.height = 'auto';
    t.style.height = Math.min(t.scrollHeight, 200) + 'px';
    updateSendBtn();
  }
  function updateSendBtn() {
    const ready = ($('text').value.trim() || pending.some((p) => p.done)) &&
      !pending.some((p) => !p.done && !p.err);
    $('send').classList.toggle('ready', !!ready);
    $('send').disabled = !ready;
  }
  $('text').addEventListener('input', autoGrow);
  $('text').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMsg(); }
  });
  document.querySelectorAll('.suggests button').forEach((b) => {
    b.onclick = () => { $('text').value = b.dataset.q; autoGrow(); $('text').focus(); };
  });

  async function sendMsg() {
    const text = $('text').value.trim();
    const files = pending.filter((p) => p.done).map((p) => p.file);
    if (!text && !files.length) return;
    if (pending.some((p) => !p.done && !p.err)) { showError('还有文件在上传，稍等'); return; }
    $('send').disabled = true;
    try {
      await api('/api/send', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text, files: files })
      });
      $('text').value = ''; autoGrow();
      pending.forEach((p) => p.url && URL.revokeObjectURL(p.url));
      pending = []; renderPending();
      setTyping(true);
      setTimeout(() => { if (waiting) setTyping(false); }, 180000);
    } catch (e) {
      showError(e.message);
    } finally {
      updateSendBtn();
    }
  }
  $('send').onclick = sendMsg;

  // ---------- 上传 ----------
  function renderPending() {
    const box = $('pending');
    box.innerHTML = '';
    pending.forEach((p) => {
      const chip = document.createElement('div');
      chip.className = 'chip' + (p.done ? ' done' : '');
      if (p.isImage) {
        chip.innerHTML = '<img src="' + p.url + '" alt="">';
        chip.querySelector('img').onclick = () => {
          const imgs = pending.filter((q) => q.isImage && q.url);
          openViewer(imgs.map((q) => ({ url: q.url, name: q.name })), imgs.indexOf(p));
        };
      } else {
        chip.innerHTML = '<div class="doc"><span style="font-size:20px">📄</span><span class="n">' + esc(p.name) + '</span></div>';
      }
      if (!p.done) {
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.width = Math.round((p.progress || 0) * 100) + '%';
        chip.appendChild(bar);
      }
      p.el = chip;
      if (p.note && p.done) {
        const note = document.createElement('div');
        note.className = 'note';
        note.textContent = p.note;
        chip.appendChild(note);
      }
      const x = document.createElement('button');
      x.className = 'x';
      x.textContent = '✕';
      x.onclick = () => {
        if (p.url) URL.revokeObjectURL(p.url);
        pending.splice(pending.indexOf(p), 1);
        renderPending(); updateSendBtn();
      };
      chip.appendChild(x);
      box.appendChild(chip);
    });
    updateSendBtn();
  }

  // 图片先压缩再传：聊天截图/照片动辄好几 MB，压到 1600px/JPEG 后通常小一个数量级。
  async function compressImage(file) {
    const type = (file.type || '').toLowerCase();
    if (!/^image\/(png|jpe?g|webp|bmp|avif)$/.test(type)) return null; // gif/svg 不动
    if (file.size < 400 * 1024) return null;                          // 小图不折腾
    let bitmap;
    try { bitmap = await createImageBitmap(file); } catch (e) { return null; }
    const maxDim = 1600;
    const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
    const w = Math.max(1, Math.round(bitmap.width * scale));
    const h = Math.max(1, Math.round(bitmap.height * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
    if (bitmap.close) try { bitmap.close(); } catch (e) {}
    const blob = await new Promise((res) => { try { canvas.toBlob(res, 'image/jpeg', 0.85); } catch (e) { res(null); } });
    if (!blob || blob.size >= file.size) return null;
    const base = (file.name || 'image').replace(/\.[^.]+$/, '');
    return new File([blob], base + '.jpg', { type: 'image/jpeg' });
  }

  function uploadOne(file, onProgress) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload?name=' + encodeURIComponent(file.name));
      xhr.setRequestHeader('Authorization', 'Bearer ' + token);
      xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
      xhr.onload = () => {
        let body = null;
        try { body = JSON.parse(xhr.responseText); } catch (e) {}
        if (xhr.status >= 200 && xhr.status < 300) resolve(body);
        else if (xhr.status === 401) { logout(true); reject(new Error('登录已失效')); }
        else reject(new Error((body && body.error) || ('HTTP ' + xhr.status)));
      };
      xhr.onerror = () => reject(new Error('网络错误'));
      xhr.send(file);
    });
  }

  async function addFiles(fileList) {
    const jobs = [];
    for (const f of Array.from(fileList)) {
      if (f.size > 20 * 1024 * 1024) { showError('「' + f.name + '」超过 20MB 上限'); continue; }
      const isImage = /^image\//.test(f.type || '');
      jobs.push({ original: f, isImage: isImage });
    }
    // 压缩（并行）之后逐个登记
    const prepared = await Promise.all(jobs.map(async (j) => {
      const smaller = await compressImage(j.original);
      return { file: smaller || j.original, isImage: j.isImage, saved: smaller ? j.original.size - smaller.size : 0 };
    }));
    for (const p of prepared) {
      const item = {
        file: p.file, name: p.file.name, isImage: p.isImage || /^image\//.test(p.file.type || ''),
        progress: 0, done: false, note: p.saved > 0 ? '已压缩 ' + fmtSize(p.saved) : '',
        url: p.isImage ? URL.createObjectURL(p.file) : ''
      };
      pending.push(item); renderPending();
      uploadOne(p.file, (v) => {
        item.progress = v;
        const b = item.el && item.el.querySelector('.bar');
        if (b) b.style.width = Math.round(v * 100) + '%';
      })
        .then((ref) => { item.file = ref; item.done = true; renderPending(); })
        .catch((e) => { item.err = true; showError('上传失败：' + e.message); pending.splice(pending.indexOf(item), 1); renderPending(); });
    }
    $('text').focus();
  }
  $('attach').onclick = (e) => { e.stopPropagation(); togglePlus(); };
  $('pm-upload').onclick = () => { closePlus(); $('file').click(); };
  $('file').onchange = () => { addFiles($('file').files); $('file').value = ''; };
  document.addEventListener('paste', (e) => {
    if ($('app').style.display === 'none') return;
    const files = e.clipboardData && e.clipboardData.files;
    if (files && files.length) { e.preventDefault(); addFiles(files); }
  });
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => { e.preventDefault(); if (++dragDepth === 1) $('drop').classList.add('on'); });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('drop').classList.remove('on'); } });
  window.addEventListener('drop', (e) => {
    e.preventDefault(); dragDepth = 0; $('drop').classList.remove('on');
    if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  // ---------- + 菜单（技能 / 模型 / 思考强度 / Workspace） ----------
  let options = null;
  function togglePlus() {
    const m = $('plusmenu');
    if (m.classList.contains('on')) { closePlus(); return; }
    m.classList.add('on');
    loadOptions(true).catch((e) => showError(e.message));
  }
  function closePlus() { $('plusmenu').classList.remove('on'); }
  document.addEventListener('click', (e) => {
    if (!$('plusmenu').classList.contains('on')) return;
    if (e.target.closest('#plusmenu') || e.target.closest('#attach')) return;
    closePlus();
  });
  async function loadOptions(force) {
    if (options && !force) { renderPlusMenu(); return options; }
    options = await api('/api/options');
    renderPlusMenu();
    return options;
  }
  function renderPlusMenu() {
    if (!options) return;
    // 技能
    const sec = $('pm-skills');
    sec.querySelectorAll('.pm-item').forEach((n) => n.remove());
    (options.skills || []).forEach((sk) => {
      const b = document.createElement('button');
      b.className = 'pm-item';
      b.innerHTML = '<span>' + esc(sk.name) + '</span>' + (sk.desc ? '<span class="pm-desc">' + esc(sk.desc) + '</span>' : '');
      b.onclick = () => {
        $('text').value = sk.prompt || sk.name;
        autoGrow(); closePlus(); $('text').focus();
        $('text').setSelectionRange($('text').value.length, $('text').value.length);
      };
      sec.appendChild(b);
    });
    // 工具（workspace 仅管理员）
    $('pm-tools').style.display = options.admin ? '' : 'none';
    // 模型
    renderModels($('pm-modelfilter').value || '');
    $('pm-model-cur').textContent = options.model || ('默认 · ' + (options.defaultModel || ''));
    // 思考强度
    const ef = $('pm-efforts');
    ef.innerHTML = '';
    const effLabels = { low: '低', medium: '中', high: '高' };
    [''].concat(options.efforts || []).forEach((v) => {
      const b = document.createElement('button');
      b.className = 'pm-chip' + ((options.effort || '') === v ? ' on' : '');
      b.textContent = v === '' ? '自动' : (effLabels[v] || v);
      b.onclick = () => setPrefs({ effort: v });
      ef.appendChild(b);
    });
  }
  function renderModels(filter) {
    const box = $('pm-models');
    box.innerHTML = '';
    const cur = options.model || '';
    const mk = (value, label, hint) => {
      const b = document.createElement('button');
      b.className = 'pm-item model' + (cur === value ? ' on' : '');
      b.innerHTML = '<span>' + esc(label) + (hint ? ' <span class="pm-desc">' + esc(hint) + '</span>' : '') + '</span><span class="pm-check">✓</span>';
      b.onclick = () => setPrefs({ model: value });
      box.appendChild(b);
    };
    mk('', '默认' + (options.defaultModel ? ' · ' + options.defaultModel : ''), '');
    const f = (filter || '').trim().toLowerCase();
    (options.models || []).forEach((m) => {
      if (f && m.toLowerCase().indexOf(f) < 0) return;
      mk(m, m, m === options.defaultModel ? '默认' : '');
    });
  }
  $('pm-modelfilter').addEventListener('input', () => { if (options) renderModels($('pm-modelfilter').value); });
  async function setPrefs(patch) {
    try {
      const r = await api('/api/prefs', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch)
      });
      options.model = r.model; options.effort = r.effort;
      renderPlusMenu();
      showError('已切换：' + [
        r.model ? '模型 ' + r.model : '模型 默认',
        '思考强度 ' + (r.effort ? ({ low: '低', medium: '中', high: '高' }[r.effort] || r.effort) : '自动')
      ].join(' · '));
    } catch (e) { showError(e.message); }
  }

  // ---------- Workspace 浏览器 ----------
  let wsPath = '';
  async function openWorkspace() {
    closePlus();
    $('wsmodal').classList.add('on');
    await loadWorkspace();
  }
  async function loadWorkspace() {
    const box = $('ws-list');
    box.innerHTML = '<div class="ws-empty">加载中…</div>';
    try {
      const res = await api('/api/workspace?path=' + encodeURIComponent(wsPath));
      renderWsPath(res.path || '');
      box.innerHTML = '';
      const entries = res.entries || [];
      if (wsPath) {
        const up = document.createElement('button');
        up.className = 'ws-row';
        up.innerHTML = '<span>📁</span><span class="ws-name">..</span>';
        up.onclick = () => { wsPath = wsPath.split('/').slice(0, -1).join('/'); loadWorkspace(); };
        box.appendChild(up);
      }
      if (!entries.length) {
        box.innerHTML += '<div class="ws-empty">这里是空的</div>';
      }
      entries.forEach((en) => {
        const full = (res.path ? res.path + '/' : '') + en.name;
        const row = document.createElement('a');
        row.className = 'ws-row';
        if (en.dir) {
          row.innerHTML = '<span>📁</span><span class="ws-name">' + esc(en.name) + '</span><span class="ws-size">›</span>';
          row.onclick = (e) => { e.preventDefault(); wsPath = full; loadWorkspace(); };
        } else {
          const [label, cls] = extInfo(en.name);
          const url = withTok('/api/workspace/file?path=' + encodeURIComponent(full));
          row.href = url;
          row.setAttribute('download', en.name);
          row.innerHTML = '<span class="ext ' + cls + '" style="width:28px;height:28px;font-size:9px">' + label + '</span>' +
            '<span class="ws-name">' + esc(en.name) + '</span>' +
            '<span class="ws-size">' + fmtSize(en.size || 0) + '</span>';
          if (/\.(png|jpe?g|gif|webp|bmp|avif)$/i.test(en.name)) {
            row.onclick = (e) => {
              e.preventDefault();
              openViewer([{ url: url, name: en.name }], 0);
            };
          }
        }
        box.appendChild(row);
      });
    } catch (e) {
      box.innerHTML = '<div class="ws-empty">' + esc(e.message) + '</div>';
    }
  }
  function renderWsPath(rel) {
    const parts = rel ? rel.split('/') : [];
    let html = '<a href="#" data-p="">workspace</a>';
    let acc = '';
    parts.forEach((seg) => {
      acc = acc ? acc + '/' + seg : seg;
      html += ' / <a href="#" data-p="' + esc(acc) + '">' + esc(seg) + '</a>';
    });
    const el = $('ws-path');
    el.innerHTML = html;
    el.querySelectorAll('a').forEach((a) => {
      a.onclick = (e) => { e.preventDefault(); wsPath = a.dataset.p || ''; loadWorkspace(); };
    });
  }
  $('pm-ws').onclick = openWorkspace;
  $('ws-close').onclick = () => $('wsmodal').classList.remove('on');
  $('ws-refresh').onclick = () => loadWorkspace();
  $('wsmodal').addEventListener('click', (e) => { if (e.target === $('wsmodal')) $('wsmodal').classList.remove('on'); });

  // ---------- 启动 ----------
  if (token && me) {
    api('/api/me').then((res) => {
      admin = !!res.admin; me = res.name;
      localStorage.setItem('mineagent.admin', admin ? '1' : '0');
      startChat();
    }).catch(() => logout(true));
  } else {
    logout(true);
  }
})();
</script>
