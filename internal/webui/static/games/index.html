<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="mineagent-version" content="__VER__">
<script>
  // 主题要在首屏渲染前定好，避免深色用户每次跳页闪白（shell.js 的 applyTheme 之后会再同步一次）
  (function () {
    try {
      var mode = localStorage.getItem('mineagent.theme') || 'system';
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.mode = mode;
    } catch (e) {}
  })();
</script>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131316" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/static/__VER__/img/icon-192.png">
<link rel="icon" type="image/png" href="/static/__VER__/img/favicon.png">
<title>游戏 · Mine</title>
<link rel="stylesheet" href="/static/__VER__/css/tokens.css">
<link rel="stylesheet" href="/static/__VER__/css/ds.css">
<link rel="stylesheet" href="/static/__VER__/css/portal.css">
</head>
<body>
<div id="shell-top"><div class="topbar topbar-static">
  <a class="brand" href="/"><img class="brand-logo" src="/static/__VER__/img/logo.png" alt=""><span>zkun</span></a>
  <nav class="nav"><span class="nav-item">首页</span></nav>
  <div class="spacer"></div>
</div></div>

<main class="wrap games-wrap">
  <section class="hero">
    <h1>游戏</h1>
    <p class="sub">选择游戏，创建或加入房间。</p>
  </section>
  <div class="catalog-grid" id="catalog"></div>
</main>

<script type="module" src="/static/__VER__/js/games.js"></script>
</body>
</html>
