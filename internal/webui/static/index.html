<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MineAgent</title>
<script>
  // 主题要在首屏渲染前定好，避免闪白/闪黑
  (function () {
    try {
      var mode = localStorage.getItem('mineagent.theme') || 'system';
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.mode = mode;
      var accent = localStorage.getItem('mineagent.accent');
      if (accent) document.documentElement.style.setProperty('--accent', accent);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/layout.css">
<link rel="stylesheet" href="/static/css/chat.css">
<link rel="stylesheet" href="/static/css/composer.css">
<link rel="stylesheet" href="/static/css/overlays.css">
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3v5h5"/><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M9 3H3v6"/><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M15 21h6v-6"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></symbol>
  <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="m5 12 7 7 7-7"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-workspace" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
</svg>

<div id="login">
  <div class="login-card">
    <div class="logo-mark">M</div>
    <h1>MineAgent</h1>
    <p>输入名字进入 · 每个名字独立的会话与记忆</p>
    <input id="name" class="login-input" maxlength="24" placeholder="你的名字，如 jzk" autocomplete="username">
    <button id="enter" class="login-btn">进入</button>
    <div class="login-err" id="loginerr"></div>
  </div>
</div>

<div id="app">
  <aside id="sidebar">
    <div class="side-top">
      <div class="brand"><span class="logo-mark">M</span>MineAgent</div>
    </div>
    <div class="side-actions">
      <div class="side-search" id="searchbox">
        <svg class="i sm"><use href="#i-search"/></svg>
        <input id="conv-search" class="search-input" placeholder="搜索聊天" autocomplete="off" spellcheck="false">
        <button class="search-clear" id="search-clear" hidden title="清除"><svg class="i sm"><use href="#i-x"/></svg></button>
      </div>
      <button class="nav-item" id="newchat"><svg class="i"><use href="#i-plus"/></svg>新聊天</button>
    </div>
    <div class="conv-list" id="conv-list"></div>
    <div class="side-foot">
      <button class="userbtn" id="userbtn">
        <span class="avatar" id="myavatar">?</span>
        <span class="uname" id="myname"></span>
        <span class="badge" id="myrole"></span>
        <svg class="i sm"><use href="#i-chevron"/></svg>
      </button>
      <div id="accountmenu" class="popover account-menu">
        <button class="po-item" id="menu-ws"><svg class="i"><use href="#i-workspace"/></svg>Workspace</button>
        <button class="po-item" id="menu-theme"><svg class="i"><use href="#i-theme"/></svg>外观</button>
        <div class="po-sep"></div>
        <button class="po-item" id="menu-logout"><svg class="i"><use href="#i-logout"/></svg>退出登录</button>
      </div>
    </div>
  </aside>
  <div id="backdrop"></div>

  <main>
    <header>
      <button class="icon-btn" id="menu" title="菜单"><svg class="i lg"><use href="#i-menu"/></svg></button>
      <button class="icon-btn" id="collapse" title="收起侧栏"><svg class="i lg"><use href="#i-panel"/></svg></button>
      <div class="title" id="header-title">MineAgent</div>
      <div class="spacer"></div>
    </header>

    <div id="list">
      <div id="listInner">
        <button id="loadolder" hidden>载入更早消息</button>
        <div class="empty" id="empty">
          <h2>有什么可以帮你？</h2>
          <div id="emptySlot"></div>
          <div class="suggests">
            <button data-q="看看服务器现在在线有谁">在线玩家</button>
            <button data-q="服务器状态怎么样，卡不卡？">服务器状态</button>
            <button data-q="用 PIL 画一张示意图，然后发给我">画张图发我</button>
            <button data-q="/help">看看命令</button>
          </div>
        </div>
      </div>
    </div>
    <button id="tobottom" title="回到底部"><svg class="i"><use href="#i-arrow-down"/></svg></button>

    <div id="bottomSlot">
      <div class="composer" id="composer">
        <div id="pending"></div>
        <div id="plusmenu" class="popover"></div>
        <div id="popover" class="popover"></div>
        <div id="cmdpalette" class="popover"></div>
        <div class="composer-box">
          <textarea id="text" rows="1" placeholder="给 MineAgent 发消息"></textarea>
          <div class="composer-tools">
            <input type="file" id="file" multiple hidden>
            <button class="tool-btn" id="attach" title="添加内容"><svg class="i"><use href="#i-plus"/></svg><span class="label">附件</span></button>
            <div class="spacer"></div>
            <button class="tool-btn" id="intelbtn" title="Intelligence / 模型"><span id="intellabel">Medium</span><svg class="i sm chev-right"><use href="#i-chevron"/></svg></button>
            <button class="send" id="send" disabled title="发送"><svg class="i"><use href="#i-send"/></svg></button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="wsmodal" class="modal">
  <div class="modal-card ws-card">
    <div class="ws-head">
      <div class="ws-path" id="ws-path"></div>
      <button class="icon-button" id="ws-refresh" title="刷新"><svg class="i"><use href="#i-refresh"/></svg></button>
      <button class="icon-button" id="ws-close" title="关闭"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
    <div class="ws-list" id="ws-list"></div>
  </div>
</div>

<div id="apmodal" class="modal">
  <div class="modal-card ap-card">
    <div class="ws-head">
      <div class="ap-title">外观</div>
      <div class="spacer"></div>
      <button class="icon-button" id="ap-close" title="关闭"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
    <div class="ap-body">
      <div class="ap-row">
        <div class="ap-label">主题</div>
        <div class="seg" id="theme-seg" style="--segs:3"><div class="seg-thumb" id="theme-thumb"></div>
          <button class="seg-item" data-mode="light">浅色</button>
          <button class="seg-item" data-mode="dark">深色</button>
          <button class="seg-item" data-mode="system">跟随系统</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="viewer">
  <div class="vbar">
    <span class="vname"></span>
    <span class="vcount"></span>
    <button class="vbtn" data-act="zoomout" title="缩小">−</button>
    <span class="vzoom">100%</span>
    <button class="vbtn" data-act="zoomin" title="放大">＋</button>
    <button class="vbtn" data-act="reset" title="原始大小">1:1</button>
    <a class="vbtn vdl" download title="下载"><svg class="i"><use href="#i-download"/></svg>下载</a>
    <button class="vbtn" data-act="close" title="关闭（Esc）"><svg class="i"><use href="#i-x"/></svg></button>
  </div>
  <div class="vstage" id="vstage">
    <button class="vnav prev" id="vprev" title="上一张（←）">‹</button>
    <img class="vimg" id="vimg" alt="">
    <button class="vnav next" id="vnext" title="下一张（→）">›</button>
  </div>
  <div class="vmeta">滚轮/双指缩放 · 拖动平移 · Esc 关闭</div>
</div>

<div id="dlgmodal" class="modal">
  <div class="modal-card dlg-card">
    <div class="dlg-title" id="dlg-title"></div>
    <div class="dlg-text" id="dlg-text"></div>
    <input class="dlg-input" id="dlg-input" hidden>
    <div class="dlg-actions">
      <button class="btn" id="dlg-cancel">取消</button>
      <button class="btn primary" id="dlg-ok">确定</button>
    </div>
  </div>
</div>

<div id="drop"><div class="dropcard"><svg class="i"><use href="#i-arrow-down"/></svg>松开上传文件</div></div>
<div id="toasts"></div>
<div id="connbar" hidden>连接断开，正在重连…</div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
