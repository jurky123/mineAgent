<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="mineagent-version" content="__VER__">
<link rel="icon" type="image/svg+xml" href="/static/__VER__/img/logo.svg">
<title>我的 · Mine</title>
<link rel="stylesheet" href="/static/__VER__/css/tokens.css">
<link rel="stylesheet" href="/static/__VER__/css/ds.css">
<link rel="stylesheet" href="/static/__VER__/css/portal.css">
</head>
<body>
<div id="shell-top"></div>

<main class="wrap narrow">
  <header class="account-head">
    <div class="avatar lg" id="acc-avatar">J</div>
    <div>
      <h1 id="acc-name">…</h1>
      <div class="meta" id="acc-meta"></div>
    </div>
  </header>

  <section class="section">
    <div class="section-head"><h2 class="section-title">账号</h2></div>
    <div class="card" id="acc-rows"></div>
  </section>

  <section class="section">
    <div class="section-head"><h2 class="section-title">外观</h2></div>
    <div class="card">
      <div class="list-row">
        <div class="list-main"><div class="list-title">主题</div><div class="list-sub">浅色 / 深色 / 跟随系统</div></div>
        <div class="seg" id="theme-seg"></div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="section-head"><h2 class="section-title">安全</h2></div>
    <div class="card" id="acc-security"></div>
  </section>

  <section class="section">
    <div class="section-head"><h2 class="section-title">设备</h2><div class="spacer"></div><button class="btn sm" id="revoke-others">退出其他设备</button></div>
    <div class="card" id="acc-sessions"></div>
  </section>

  <section class="section" id="stats-section" hidden>
    <div class="section-head"><h2 class="section-title">游戏</h2></div>
    <div class="card" id="acc-stats"></div>
  </section>

  <section class="section">
    <div class="section-head"><h2 class="section-title">关于</h2></div>
    <div class="card">
      <div class="list-row">
        <div class="list-main"><div class="list-title">Mine 门户</div><div class="list-sub">自建服务 · 名字即账号</div></div>
        <div class="right" id="acc-version"></div>
      </div>
      <div class="list-row action" id="logout-row">
        <div class="list-main"><div class="list-title">退出登录</div></div>
        <div class="right">→</div>
      </div>
    </div>
  </section>
</main>

<script type="module" src="/static/__VER__/js/account.js"></script>
</body>
</html>
