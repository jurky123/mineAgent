<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="mineagent-version" content="__VER__">
<script>
  // 主题要在首屏渲染前定好，避免深色用户每次跳页闪白（shell.js 的 applyTheme 之后会再同步一次）
  (function () {
    try {
      var mode = localStorage.getItem('mineagent.theme') || 'system';
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.mode = mode;
    } catch (e) {}
  })();
</script>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131316" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/static/__VER__/img/icon-192.png">
<link rel="icon" type="image/png" href="/static/__VER__/img/favicon.png">
<title>显示屏 · Mine</title>
<link rel="stylesheet" href="/static/__VER__/css/tokens.css">
<link rel="stylesheet" href="/static/__VER__/css/ds.css">
<link rel="stylesheet" href="/static/__VER__/css/portal.css">
<link rel="stylesheet" href="/static/__VER__/css/screens.css">
</head>
<body>
<div id="shell-top"></div>

<main class="wrap narrow">
  <section class="hero">
    <h1>显示屏</h1>
    <p class="sub">查看屏幕与当前内容；管理操作按账号权限开放。</p>
  <p id="screen-permission" class="field-hint" role="status"></p></section>

  <section class="section">
    <div class="section-head">
      <h2 class="section-title">浏览器屏</h2>
      <div class="spacer"></div>
      <span class="badge" id="screens-meta">加载中…</span>
    </div>
    <div class="settings" id="screens-list"></div>
    <div data-admin hidden><div class="screens-form">
      <label for="open-id">屏幕名称 / ID</label><input id="open-id" class="input" placeholder="屏幕 ID（字母数字，如 demo）">
      <label for="open-url">网页地址</label><input id="open-url" class="input" placeholder="https://example.com/">
      <button id="open-btn" class="btn primary">打开 / 更新</button>
    </div>
    <p class="field-hint">打开后到游戏里瞄准墙面执行 <code>/minedisplay browser place &lt;id&gt;</code> 摆到世界（没摆的屏只有操作层能看）。</p></div>
  </section>

  <section class="section" data-admin hidden>
    <div class="section-head">
      <h2 class="section-title">管理员设置 · 导航白名单</h2>
      <div class="spacer"></div>
      <label class="toggle">
        <input type="checkbox" id="wl-enabled">
        <span class="toggle-track"><span class="toggle-knob"></span></span>
        <span>启用</span>
      </label>
    </div>
    <p class="field-hint">关闭（默认）＝任意公网站点都能打开/跳转，仍然拦截内网地址；启用＝只有下面列出的站可以（子域自动匹配）。</p>
    <div id="wl-hosts" class="screens-chips"></div>
    <div class="screens-form">
      <label for="wl-host">允许的域名</label><input id="wl-host" class="input" placeholder="example.com（子域自动匹配）">
      <button id="wl-add" class="btn">添加</button>
      <button id="wl-presets" class="btn">一键加入常用站</button>
    </div>
  </section>
</main>

<script type="module" src="/static/__VER__/js/display.js"></script>
</body>
</html>
