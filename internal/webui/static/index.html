<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MineAgent</title>
<style>
  :root {
    --bg: #ffffff;
    --sidebar: #f9f9f9;
    --surface: #ffffff;
    --surface-hover: #f2f2f2;
    --surface-active: #ececec;
    --text: #0d0d0d;
    --text-2: #5d5d5d;
    --text-3: #8f8f8f;
    --border: #e5e5e5;
    --border-2: #d9d9d9;
    --user-bubble: #f4f4f4;
    --accent: #0d0d0d;
    --danger: #d92d20;
    --ok: #067647;
    --shadow-popover: 0 8px 28px rgba(0, 0, 0, .10);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --radius-composer: 26px;
    --col: 48rem;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); overflow: hidden;
    font: 15.5px/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; }
  ::selection { background: #d9d9ff; }
  :focus-visible { outline: 2px solid #b9b9b9; outline-offset: 2px; border-radius: 6px; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #d9d9d9; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #c4c4c4; }
  .i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .i.lg { width: 18px; height: 18px; }
  [hidden] { display: none !important; }

  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes screenIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes screenOut { to { opacity: 0; transform: translateY(-6px); } }
  #app.enter, #login.enter { animation: screenIn .28s cubic-bezier(.2,.8,.2,1); }
  #app.leave, #login.leave { animation: screenOut .16s ease forwards; }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes fadein { from { opacity: 0; } }

  /* ---------- 登录 ---------- */
  #login { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); z-index: 50; }
  .login-card { width: 100%; max-width: 360px; text-align: center; }
  .logo-mark {
    width: 44px; height: 44px; margin: 0 auto 16px; border-radius: 12px;
    background: var(--text); color: #fff; display: flex; align-items: center;
    justify-content: center; font-weight: 700; font-size: 19px;
  }
  .login-card h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
  .login-card p { margin: 0 0 22px; color: var(--text-3); font-size: 13.5px; }
  .login-input {
    width: 100%; padding: 12px 14px; border-radius: var(--radius-md); border: 1px solid var(--border-2);
    background: var(--surface); color: var(--text); font: inherit; outline: none;
  }
  .login-input::placeholder { color: var(--text-3); }
  .login-input:focus { border-color: var(--text-3); }
  .login-btn {
    width: 100%; margin-top: 12px; padding: 12px; border: 0; border-radius: var(--radius-md);
    background: var(--accent); color: #fff; font-weight: 600;
  }
  .login-btn:hover { background: #2b2b2b; }
  .login-btn:disabled { opacity: .5; }
  .login-err { color: var(--danger); font-size: 13px; min-height: 19px; margin-top: 8px; }

  /* ---------- 布局 ---------- */
  #app { display: none; height: 100%; }
  #sidebar {
    position: fixed; inset: 0 auto 0 0; width: 268px; z-index: 20; display: flex; flex-direction: column;
    background: var(--sidebar); border-right: 1px solid var(--border);
    transform: translateX(-100%); transition: transform .2s cubic-bezier(.2,.8,.2,1);
  }
  #sidebar.open { transform: none; }
  body.collapsed #sidebar { transform: translateX(-100%); }
  body.collapsed main { margin-left: 0 !important; }
  #backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 15; }
  #backdrop.on { display: block; }
  .side-top { padding: 12px 10px 6px; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 6px 8px 12px; font-weight: 600; font-size: 14.5px; }
  .brand .logo-mark { width: 26px; height: 26px; font-size: 12px; border-radius: 8px; margin: 0; }
  .side-nav { padding: 2px 10px; display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px;
    background: none; border: 0; border-radius: var(--radius-sm); font-size: 14px; color: var(--text);
    text-align: left;
  }
  .nav-item:hover { background: var(--surface-active); }
  .side-foot { margin-top: auto; padding: 10px; border-top: 1px solid var(--border); }
  .userrow { display: flex; align-items: center; gap: 9px; padding: 8px 8px 6px; font-size: 13.5px; }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%; flex: none; display: flex; align-items: center;
    justify-content: center; font-size: 12px; font-weight: 600; background: var(--surface-active); color: var(--text-2);
  }
  .userrow .uname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 11px; color: var(--text-3); }
  .badge.admin { color: var(--ok); }

  main { display: flex; flex-direction: column; height: 100%; }
  header {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px; position: sticky; top: 0; z-index: 5;
    background: rgba(255,255,255,.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
  }
  .title { font-weight: 600; font-size: 14.5px; }
  .icon-btn {
    display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0;
    background: none; border: 0; border-radius: var(--radius-sm); color: var(--text-2);
  }
  .icon-btn:hover { background: var(--surface-active); color: var(--text); }
  .spacer { flex: 1; }

  /* ---------- 消息区 ---------- */
  #list { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  #listInner { width: min(100% - 32px, var(--col)); margin-inline: auto; padding: 12px 0 24px; }
  #loadolder {
    display: block; margin: 4px auto 12px; padding: 6px 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: none; color: var(--text-2); font-size: 12.5px;
  }
  #loadolder:hover { background: var(--surface-hover); }

  .msg { display: flex; padding: 12px 0; animation: rise .2s ease both; }
  .msg.user { justify-content: flex-end; }
  .msg .body { min-width: 0; max-width: 100%; }
  .msg.user .body { max-width: 78%; display: flex; flex-direction: column; align-items: flex-end; }
  .msg.user .content {
    background: var(--user-bubble); border-radius: var(--radius-lg); padding: 10px 16px;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .msg.assistant .content { overflow-wrap: anywhere; }
  .msg .content > *:first-child { margin-top: 0; }
  .msg .content > *:last-child { margin-bottom: 0; }

  .actions { display: flex; align-items: center; gap: 6px; margin-top: 4px; opacity: 0; transition: opacity .12s; }
  .msg:hover .actions, .actions:focus-within { opacity: 1; }
  .actions .time { font-size: 11.5px; color: var(--text-3); }
  .act {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border: 0;
    background: none; border-radius: var(--radius-sm); color: var(--text-3); font-size: 12px;
  }
  .act:hover { background: var(--surface-hover); color: var(--text); }
  .act .i { width: 14px; height: 14px; }

  .content p { margin: 10px 0; }
  .content h2, .content h3, .content h4 { margin: 16px 0 6px; font-weight: 600; letter-spacing: -.01em; }
  .content h2 { font-size: 19px; } .content h3 { font-size: 17px; } .content h4 { font-size: 15.5px; }
  .content ul, .content ol { margin: 8px 0; padding-left: 24px; }
  .content li { margin: 3px 0; }
  .content blockquote { margin: 10px 0; padding: 2px 0 2px 14px; border-left: 3px solid var(--border-2); color: var(--text-2); }
  .content hr { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }
  .content table { border-collapse: collapse; margin: 12px 0; font-size: 14px; display: block; overflow-x: auto; max-width: 100%; }
  .content th, .content td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; }
  .content th { background: var(--sidebar); font-weight: 600; }
  .content pre {
    position: relative; background: #f7f7f8; border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 13px 14px; overflow-x: auto; font-size: 13.5px; margin: 12px 0;
  }
  .content code {
    background: #f0f0f0; padding: 1.5px 5px; border-radius: 5px; font-size: 13.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .content pre code { background: none; padding: 0; }
  .codecopy {
    position: absolute; top: 6px; right: 6px; padding: 3px 8px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--surface); color: var(--text-2); font-size: 11px;
  }
  .codecopy:hover { background: var(--surface-hover); color: var(--text); }
  .content a { color: #0b57d0; text-decoration: underline; text-underline-offset: 2px; word-break: break-all; }

  .files { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .imgbox { position: relative; max-width: 340px; }
  .imgbox img { width: 100%; border-radius: var(--radius-md); border: 1px solid var(--border); display: block; cursor: zoom-in; }
  .imgtools { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; opacity: 0; transition: opacity .12s; }
  .imgbox:hover .imgtools { opacity: 1; }
  .itool {
    width: 30px; height: 30px; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,.2);
    display: flex; align-items: center; justify-content: center; background: rgba(20,20,20,.7);
    color: #fff; text-decoration: none; padding: 0;
  }
  .itool:hover { background: rgba(20,20,20,.9); }
  .filecard {
    display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: var(--radius-md);
    border: 1px solid var(--border); background: var(--surface); color: inherit; text-decoration: none;
    font-size: 14px; max-width: 360px;
  }
  .filecard:hover { background: var(--surface-hover); }
  .ext {
    width: 36px; height: 36px; border-radius: var(--radius-sm); display: flex; align-items: center;
    justify-content: center; flex: none; font-size: 9px; font-weight: 700; letter-spacing: .04em;
    color: #fff; background: #6b7280;
  }
  .ext.pdf { background: #b42318; } .ext.doc { background: #175cd3; } .ext.xls { background: #067647; }
  .ext.ppt { background: #b54708; } .ext.zip { background: #7a5af8; } .ext.img { background: #7f56d9; }
  .ext.audio { background: #c11574; } .ext.video { background: #3538cd; } .ext.code { background: #0e7090; }
  .ext.txt { background: #667085; }
  .filecard .fmeta { min-width: 0; flex: 1; }
  .filecard .fname { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .filecard .fsize { color: var(--text-3); font-size: 12px; }
  .filecard .fdl { color: var(--text-3); flex: none; display: flex; }
  .filecard:hover .fdl { color: var(--text); }

  .typing { color: var(--text-3); font-size: 13.5px; padding: 4px 0 8px; }
  .typing .dots span {
    display: inline-block; width: 5px; height: 5px; margin-right: 3px; border-radius: 50%;
    background: var(--text-3); animation: blink 1.2s infinite both;
  }
  .typing .dots span:nth-child(2) { animation-delay: .2s; }
  .typing .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* ---------- 空状态 + Composer ---------- */
  .empty { text-align: center; }
  .empty h2 { margin: 12vh 0 26px; font-size: 28px; font-weight: 600; letter-spacing: -.02em; }
  .suggests { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .suggests button {
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text-2); font-size: 13.5px;
  }
  .suggests button:hover { background: var(--surface-hover); color: var(--text); }
  #emptySlot { width: 100%; margin: 0 auto; }
  #bottomSlot { padding: 0 16px calc(12px + env(safe-area-inset-bottom)); }
  .composer { width: min(100%, var(--col)); margin: 0 auto; position: relative; }
  .composer-box {
    display: flex; flex-direction: column; border: 1px solid var(--border-2);
    border-radius: var(--radius-composer); background: var(--surface); padding: 12px 14px 8px;
  }
  .composer-box:focus-within { border-color: var(--text-3); }
  .composer-box textarea {
    width: 100%; border: 0; outline: none; background: none; color: var(--text); font: inherit;
    resize: none; max-height: 200px; min-height: 26px; padding: 0 2px;
  }
  .composer-box textarea::placeholder { color: var(--text-3); }
  .composer-tools { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
  .tool-btn {
    display: flex; align-items: center; gap: 5px; padding: 5px 9px; border: 0; background: none;
    border-radius: var(--radius-sm); color: var(--text-2); font-size: 13px; max-width: 42vw;
  }
  .tool-btn:hover { background: var(--surface-hover); color: var(--text); }
  .tool-btn .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool-btn .i { width: 15px; height: 15px; }
  .send {
    display: flex; align-items: center; justify-content: center; width: 32px; height: 32px;
    border: 0; border-radius: 50%; background: #e8e8e8; color: #b0b0b0; padding: 0;
  }
  .send.ready { background: var(--accent); color: #fff; }
  .send.ready:hover { background: #2b2b2b; }
  .send:disabled { cursor: default; }

  #pending { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 8px; }
  #pending:empty { display: none; }
  .chip {
    position: relative; width: 68px; height: 68px; border-radius: var(--radius-md); overflow: hidden;
    border: 1px solid var(--border-2); background: var(--surface);
  }
  .chip img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
  .chip .doc { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px; }
  .chip .doc .n { font-size: 9.5px; color: var(--text-3); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .x {
    position: absolute; top: 3px; right: 3px; width: 19px; height: 19px; border-radius: 50%;
    border: 0; background: rgba(20,20,20,.72); color: #fff; font-size: 11px; padding: 0; line-height: 1;
  }
  .chip .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--text); width: 0; transition: width .15s; }
  .chip.done .bar { background: var(--ok); }
  .chip .note { position: absolute; left: 0; right: 0; bottom: 3px; font-size: 9px; text-align: center; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }

  /* ---------- 弹层（统一：白底 + 很轻的 shadow） ---------- */
  .popover {
    position: absolute; z-index: 12; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-md); box-shadow: var(--shadow-popover); padding: 6px; display: none;
  }
  .popover.on { display: block; animation: pop .12s ease-out; }
  #plusmenu { left: 0; bottom: calc(100% + 10px); width: 240px; }
  #popover { right: 0; bottom: calc(100% + 10px); width: 300px; }
  .po-title { font-size: 11.5px; color: var(--text-3); padding: 6px 10px 4px; }
  .po-item {
    display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; border: 0;
    background: none; border-radius: var(--radius-sm); font-size: 13.5px; text-align: left;
  }
  .po-item:hover { background: var(--surface-hover); }
  .po-item .check { margin-left: auto; color: var(--text); visibility: hidden; }
  .po-item.on .check { visibility: visible; }
  .po-sep { height: 1px; background: var(--border); margin: 5px 4px; }
  .po-scroll { max-height: 220px; overflow-y: auto; }
  .po-desc { color: var(--text-3); font-size: 11.5px; }
  .po-filter {
    width: calc(100% - 16px); margin: 2px 8px 6px; padding: 6px 9px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); font: inherit; font-size: 13px; outline: none; color: var(--text);
  }
  .po-filter:focus { border-color: var(--text-3); }

  /* 思考强度：中性分段框（放在 popover 里） */
  .seg { position: relative; display: flex; margin: 2px 6px 6px; padding: 3px; border-radius: 10px; background: #f0f0f0; user-select: none; touch-action: none; }
  .seg-thumb {
    position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 4);
    border-radius: 8px; background: var(--surface); border: 1px solid var(--border-2);
    transition: transform .3s cubic-bezier(.22,1.3,.36,1); z-index: 0; will-change: transform;
  }
  .seg.dragging .seg-thumb { transition: none; }
  .seg-item {
    position: relative; z-index: 1; flex: 1; border: 0; background: none; padding: 6px 0;
    font-size: 12.5px; color: var(--text-3); border-radius: 8px;
  }
  .seg-item.on { color: var(--text); font-weight: 600; }

  #cmdpalette { left: 0; right: 0; bottom: calc(100% + 10px); }
  .cmd-item { display: flex; gap: 12px; align-items: baseline; width: 100%; border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: var(--radius-sm); font-size: 13.5px; }
  .cmd-item.on, .cmd-item:hover { background: var(--surface-hover); }
  .cmd-item .c { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); min-width: 92px; }
  .cmd-item .d { color: var(--text-3); font-size: 12px; }

  #toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: 108px; z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
  .toast {
    pointer-events: auto; max-width: min(540px, 90vw); cursor: pointer; padding: 9px 16px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    font-size: 13.5px; box-shadow: var(--shadow-popover);
  }
  .toast.err { border-color: #fda29b; color: var(--danger); }
  .toast.out { animation: fadein .2s ease reverse forwards; }
  .toast.ok { border-color: #a6f4c5; color: var(--ok); }
  #connbar {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 65;
    padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
    font-size: 12.5px; color: var(--text-2); box-shadow: var(--shadow-popover);
  }
  #tobottom {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 112px; width: 34px; height: 34px;
    display: none; align-items: center; justify-content: center; border-radius: 50%;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-2); z-index: 6;
    box-shadow: var(--shadow-popover);
  }
  #tobottom.on { display: flex; }

  #drop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(255,255,255,.7); z-index: 30; }
  #drop.on { display: flex; }
  .dropcard {
    display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 36px 48px;
    border: 2px dashed var(--border-2); border-radius: var(--radius-lg); background: var(--surface);
    color: var(--text-2); font-size: 14px; box-shadow: var(--shadow-popover);
  }
  .dropcard .i { width: 24px; height: 24px; }

  /* ---------- Workspace ---------- */
  #wsmodal { position: fixed; inset: 0; background: rgba(0,0,0,.25); display: none; align-items: center; justify-content: center; z-index: 35; padding: 20px; }
  #wsmodal.on { display: flex; animation: fadein .15s ease; }
  #wsmodal.closing { animation: fadein .12s ease reverse forwards; }
  .ws-card {
    width: 100%; max-width: 620px; max-height: 76vh; display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-popover); overflow: hidden; animation: pop .15s ease-out;
  }
  .ws-head { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .ws-path { flex: 1; font-size: 13px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-path a { color: var(--text-2); text-decoration: none; cursor: pointer; }
  .ws-path a:hover { color: var(--text); text-decoration: underline; }
  .icon-button {
    display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; padding: 0;
    border: 1px solid transparent; border-radius: var(--radius-sm); background: none; color: var(--text-2);
  }
  .icon-button:hover { background: var(--surface-hover); color: var(--text); }
  .ws-list { overflow-y: auto; padding: 6px; }
  .ws-row {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0;
    border-radius: var(--radius-sm); background: none; color: inherit; text-decoration: none;
    font-size: 14px; text-align: left; cursor: pointer;
  }
  .ws-row:hover { background: var(--surface-hover); }
  .ws-row .ws-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-row .ws-size { color: var(--text-3); font-size: 12px; }
  .ws-row .i { color: var(--text-3); }
  .ws-empty { color: var(--text-3); font-size: 13px; text-align: center; padding: 26px; }

  /* ---------- 图片查看器（保持暗色，媒体浏览习惯） ---------- */
  #viewer { position: fixed; inset: 0; background: rgba(10,10,12,.95); display: none; flex-direction: column; z-index: 40; }
  #viewer.on { display: flex; animation: fadein .14s ease; }
  #viewer.closing { animation: fadein .12s ease reverse forwards; }
  .vbar { display: flex; align-items: center; gap: 6px; padding: 12px 14px; color: #e8e8e8; }
  .vname { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
  .vcount { color: #9a9a9a; font-size: 12px; flex: 1; }
  .vbtn {
    display: flex; align-items: center; justify-content: center; min-width: 32px; height: 32px;
    padding: 0 9px; border: 1px solid rgba(255,255,255,.16); border-radius: var(--radius-sm);
    background: rgba(255,255,255,.06); color: #e8e8e8; font-size: 12.5px; text-decoration: none; gap: 5px;
  }
  .vbtn:hover { background: rgba(255,255,255,.16); }
  .vzoom { min-width: 44px; text-align: center; font-size: 12px; color: #b9b9b9; }
  .vstage { flex: 1; position: relative; overflow: hidden; touch-action: none; display: flex; align-items: center; justify-content: center; }
  .vimg { max-width: 100%; max-height: 100%; user-select: none; -webkit-user-drag: none; transform-origin: center center; cursor: grab; }
  .vimg.grabbing { cursor: grabbing; }
  .vnav {
    position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 56px; border: 0;
    border-radius: var(--radius-md); background: rgba(255,255,255,.08); color: #fff; font-size: 22px; line-height: 1;
  }
  .vnav:hover { background: rgba(255,255,255,.18); }
  .vnav.prev { left: 14px; } .vnav.next { right: 14px; }
  .vmeta { padding: 8px 14px 14px; color: #8a8a8a; font-size: 12px; text-align: center; }

  @media (min-width: 900px) {
    #sidebar { transform: none; }
    main { margin-left: 268px; }
    #menu { display: none; }
    #backdrop { display: none !important; }
  }
  @media (max-width: 899px) {

    .empty h2 { margin-top: 9vh; font-size: 24px; }
    .tool-btn .label.model { max-width: 26vw; }
  }
</style>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const ICON = {
    copy: '<svg class="i"><use href="#i-copy"/></svg>',
    download: '<svg class="i"><use href="#i-download"/></svg>',
    expand: '<svg class="i"><use href="#i-expand"/></svg>',
    file: '<svg class="i lg"><use href="#i-file"/></svg>',
    folder: '<svg class="i lg"><use href="#i-folder"/></svg>',
    check: '<svg class="i"><use href="#i-check"/></svg>',
    x: '<svg class="i"><use href="#i-x"/></svg>'
  };

  let token = localStorage.getItem('mineagent.token') || '';
  let me = localStorage.getItem('mineagent.name') || '';
  let admin = localStorage.getItem('mineagent.admin') === '1';
  let options = null;
  let pending = [];
  let msgIds = new Set();
  let lastId = 0, oldestId = 0, hasMore = false;
  let es = null, waiting = false;

  // ---------- 基础工具 ----------
  async function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers, { 'Authorization': 'Bearer ' + token });
    const res = await fetch(path, opts);
    let body = null;
    try { body = await res.json(); } catch (e) { /* 空响应 */ }
    if (res.status === 401) { logout(true); throw new Error('登录已失效，请重新进入'); }
    if (!res.ok) throw new Error((body && body.error) || ('HTTP ' + res.status));
    return body;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function withTok(u) {
    if (!u || u.startsWith('blob:') || u.startsWith('data:')) return u;
    return u + (u.indexOf('?') >= 0 ? '&' : '?') + 'token=' + encodeURIComponent(token);
  }
  function fmtSize(n) {
    if (!n && n !== 0) return '';
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1048576).toFixed(1) + ' MB';
  }
  function fmtTime(ms) {
    const d = new Date(ms || Date.now());
    return d.toTimeString().slice(0, 5);
  }
  function toast(msg, type) {
    const box = $('toasts');
    const t = document.createElement('div');
    t.className = 'toast ' + (type || '');
    t.textContent = msg;
    t.onclick = () => { t.classList.add('out'); setTimeout(() => t.remove(), 200); };
    box.appendChild(t);
    while (box.children.length > 3) box.firstChild.remove();
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 200); }, 3200);
  }
  function showError(msg) { toast(msg, 'err'); }
  function hideAnimated(el, done) {
    if (!el.classList.contains('on')) { if (done) done(); return; }
    el.classList.add('closing');
    setTimeout(() => { el.classList.remove('on', 'closing'); if (done) done(); }, 140);
  }
  function extInfo(name) {
    const ext = (String(name || '').split('.').pop() || '').toLowerCase();
    const map = {
      pdf: ['PDF', 'pdf'], doc: ['DOC', 'doc'], docx: ['DOC', 'doc'], rtf: ['RTF', 'doc'],
      xls: ['XLS', 'xls'], xlsx: ['XLS', 'xls'], csv: ['CSV', 'xls'],
      ppt: ['PPT', 'ppt'], pptx: ['PPT', 'ppt'],
      txt: ['TXT', 'txt'], md: ['MD', 'txt'], log: ['LOG', 'txt'],
      json: ['JSON', 'code'], js: ['JS', 'code'], ts: ['TS', 'code'], py: ['PY', 'code'],
      java: ['JAVA', 'code'], go: ['GO', 'code'], sh: ['SH', 'code'], html: ['HTML', 'code'],
      css: ['CSS', 'code'], xml: ['XML', 'code'], yml: ['YML', 'code'], yaml: ['YML', 'code'],
      zip: ['ZIP', 'zip'], rar: ['RAR', 'zip'], '7z': ['7Z', 'zip'], tar: ['TAR', 'zip'], gz: ['GZ', 'zip'],
      mp3: ['MP3', 'audio'], wav: ['WAV', 'audio'], m4a: ['M4A', 'audio'], flac: ['FLAC', 'audio'],
      mp4: ['MP4', 'video'], mov: ['MOV', 'video'], mkv: ['MKV', 'video'], webm: ['WEBM', 'video']
    };
    if (map[ext]) return map[ext];
    return [ext ? ext.slice(0, 4).toUpperCase() : 'FILE', 'txt'];
  }

  // ---------- Markdown（标题/列表/引用/表格/代码/链接） ----------
  function renderContent(el, text) {
    const src = String(text || '');
    const blocks = [];
    const withPh = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
      blocks.push('<pre><code>' + esc(code.replace(/\n$/, '')) + '</code></pre>');
      return '\u0000' + (blocks.length - 1) + '\u0000';
    });
    const lines = withPh.split('\n');
    const out = [];
    const inline = (s) => esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(（])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[^"'>\w])(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    const cells = (line) => line.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
    const isBlockStart = (t) => t === '' || /^\u0000\d+\u0000$/.test(t) || /^#{1,6}\s/.test(t) ||
      /^>\s?/.test(t) || /^[-*]\s+/.test(t) || /^\d+[.)]\s+/.test(t) || /^(-{3,}|\*{3,}|_{3,})$/.test(t);
    let i = 0;
    while (i < lines.length) {
      const t = lines[i].trim();
      if (t === '') { i++; continue; }
      if (/^\u0000\d+\u0000$/.test(t)) { out.push('<div>' + t + '</div>'); i++; continue; }
      const h = t.match(/^(#{1,6})\s+(.*)$/);
      if (h) { const lv = Math.min(h[1].length + 1, 6); out.push('<h' + lv + '>' + inline(h[2]) + '</h' + lv + '>'); i++; continue; }
      if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { out.push('<hr>'); i++; continue; }
      if (/^>\s?/.test(t)) {
        const buf = [];
        while (i < lines.length && /^>\s?/.test(lines[i].trim())) { buf.push(lines[i].trim().replace(/^>\s?/, '')); i++; }
        out.push('<blockquote>' + buf.map((x) => '<div>' + inline(x) + '</div>').join('') + '</blockquote>');
        continue;
      }
      if (t.includes('|') && i + 1 < lines.length && /^\s*\|?[\s:|-]*-[\s:|-]*\|?[\s:|-]*$/.test(lines[i + 1].trim()) && lines[i + 1].includes('-')) {
        const head = cells(t); i += 2;
        const rows = [];
        while (i < lines.length && lines[i].includes('|') && lines[i].trim() !== '') { rows.push(cells(lines[i])); i++; }
        out.push('<table><thead><tr>' + head.map((c) => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>' +
          rows.map((r) => '<tr>' + r.map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>');
        continue;
      }
      if (/^[-*]\s+/.test(t)) {
        const items = [];
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { items.push(lines[i].trim().replace(/^\s*[-*]\s+/, '')); i++; }
        out.push('<ul>' + items.map((x) => '<li>' + inline(x) + '</li>').join('') + '</ul>');
        continue;
      }
      if (/^\d+[.)]\s+/.test(t)) {
        const items = [];
        while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { items.push(lines[i].trim().replace(/^\s*\d+[.)]\s+/, '')); i++; }
        out.push('<ol>' + items.map((x) => '<li>' + inline(x) + '</li>').join('') + '</ol>');
        continue;
      }
      const buf = [t];
      i++;
      while (i < lines.length && !isBlockStart(lines[i].trim())) { buf.push(lines[i].trim()); i++; }
      out.push('<p>' + buf.map((x) => inline(x)).join('<br>') + '</p>');
    }
    el.innerHTML = out.join('').replace(/\u0000(\d+)\u0000/g, (m, n) => blocks[+n]);
  }

  // ---------- 消息渲染 ----------
  function fileBubble(f) {
    const name = f.name || '文件';
    if (f.image) {
      const src = withTok(f.url);
      return '<div class="imgbox"><img src="' + esc(src) + '" alt="' + esc(name) + '" loading="lazy" data-zoom="' + esc(src) + '" data-name="' + esc(name) + '">' +
        '<div class="imgtools">' +
        '<button class="itool" data-preview title="查看">' + ICON.expand + '</button>' +
        '<a class="itool" href="' + esc(src) + '" download="' + esc(name) + '" title="下载">' + ICON.download + '</a>' +
        '</div></div>';
    }
    const [label, cls] = extInfo(name);
    return '<a class="filecard" href="' + esc(withTok(f.url)) + '" download="' + esc(name) + '" title="' + esc(name) + '">' +
      '<span class="ext ' + cls + '">' + label + '</span>' +
      '<span class="fmeta"><span class="fname">' + esc(name) + '</span>' +
      (f.size ? '<span class="fsize">' + fmtSize(f.size) + '</span>' : '') + '</span>' +
      '<span class="fdl">' + ICON.download + '</span></a>';
  }
  function addCodeCopy(row) {
    row.querySelectorAll('pre').forEach((pre) => {
      const btn = document.createElement('button');
      btn.className = 'codecopy';
      btn.textContent = '复制';
      btn.onclick = () => {
        const code = pre.querySelector('code');
        navigator.clipboard.writeText(code ? code.textContent : '').then(() => {
          btn.textContent = '已复制'; setTimeout(() => { btn.textContent = '复制'; }, 1200);
        });
      };
      pre.appendChild(btn);
    });
  }
  function renderMsg(m, prepend) {
    if (msgIds.has(m.id)) return;
    msgIds.add(m.id);
    const row = document.createElement('div');
    row.className = 'msg ' + (m.role === 'user' ? 'user' : 'assistant');
    row.dataset.raw = m.text || '';
    let html = '<div class="body">';
    if (m.role === 'assistant') {
      html += '<div class="content"></div>' +
        (m.files && m.files.length ? '<div class="files">' + m.files.map(fileBubble).join('') + '</div>' : '') +
        '<div class="actions"><span class="time">' + fmtTime(m.at) + '</span>' +
        '<button class="act copy">' + ICON.copy + '复制</button></div>';
    } else {
      html += '<div class="content"></div>' +
        (m.files && m.files.length ? '<div class="files">' + m.files.map(fileBubble).join('') + '</div>' : '') +
        '<div class="actions"><button class="act copy">' + ICON.copy + '复制</button></div>';
    }
    html += '</div>';
    row.innerHTML = html;
    const content = row.querySelector('.content');
    if (m.role === 'assistant') renderContent(content, m.text || '');
    else content.textContent = m.text || '';
    const copy = row.querySelector('.copy');
    if (copy) copy.onclick = () => {
      navigator.clipboard.writeText(row.dataset.raw).then(() => {
        copy.innerHTML = ICON.check + '已复制'; setTimeout(() => { copy.innerHTML = ICON.copy + '复制'; }, 1200);
      });
    };
    addCodeCopy(row);
    oldestId = oldestId ? Math.min(oldestId, m.id) : m.id;
    const nearBottom = scrollNearBottom();
    if (prepend) $('listInner').insertBefore(row, $('loadolder').nextSibling);
    else $('listInner').appendChild(row);
    if (!prepend && nearBottom) toBottom(); else updateToBottom();
    layout();
  }
  function clearMessages() {
    $('listInner').querySelectorAll('.msg,.typing').forEach((n) => n.remove());
    msgIds.clear(); lastId = 0; oldestId = 0; hasMore = false;
    updateLoadOlder(); setTyping(false); layout(true);
  }
  function setTyping(on) {
    waiting = on;
    const old = $('listInner').querySelector('.typing');

  function dockComposer(atBottom, animate) {
    const c = $('composer');
    const target = atBottom ? $('bottomSlot') : $('emptySlot');
    if (c.parentElement === target) return;
    const from = c.getBoundingClientRect();
    target.appendChild(c);
    if (!animate) return;
    const to = c.getBoundingClientRect();
    const dx = from.left - to.left, dy = from.top - to.top;
    if (!dx && !dy) return;
    c.style.transition = 'none';
    c.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    requestAnimationFrame(() => {
      c.style.transition = 'transform .3s cubic-bezier(.2,.8,.2,1)';

  // ---------- 图片查看器 ----------
  const viewer = { list: [], index: 0, scale: 1, x: 0, y: 0, drag: false, sx: 0, sy: 0, ox: 0, oy: 0 };
  const V = () => $('viewer');
  function openViewer(list, index) {
    if (!list || !list.length) return;
    viewer.list = list;
    viewer.index = Math.max(0, Math.min(index || 0, list.length - 1));
    V().classList.add('on');
    document.body.style.overflow = 'hidden';
    showViewerImage();
  }
  function closeViewer() {
    if (!V().classList.contains('on')) return;
    hideAnimated(V(), () => { viewer.list = []; });
    document.body.style.overflow = '';
  }
  function showViewerImage() {
    const it = viewer.list[viewer.index] || {};
    const img = $('vimg');
    img.src = it.url || ''; img.alt = it.name || '';
    document.querySelector('.vname').textContent = it.name || '';
    document.querySelector('.vcount').textContent = viewer.list.length > 1 ? (viewer.index + 1) + ' / ' + viewer.list.length : '';
    const many = viewer.list.length > 1;
    $('vprev').style.visibility = many ? 'visible' : 'hidden';
    $('vnext').style.visibility = many ? 'visible' : 'hidden';
    const dl = document.querySelector('.vdl');
    dl.href = it.url || '';
    if (it.name) dl.setAttribute('download', it.name); else dl.removeAttribute('download');
    resetZoom();
  }
  function applyZoom() {
    $('vimg').style.transform = 'translate(' + viewer.x + 'px,' + viewer.y + 'px) scale(' + viewer.scale + ')';
    document.querySelector('.vzoom').textContent = Math.round(viewer.scale * 100) + '%';
  }
  function resetZoom() { viewer.scale = 1; viewer.x = 0; viewer.y = 0; applyZoom(); }
  function zoomBy(f, cx, cy) {
    const ns = Math.min(8, Math.max(0.1, viewer.scale * f));
    const r = $('vstage').getBoundingClientRect();
    const px = (cx === undefined ? r.width / 2 : cx - r.left) - r.width / 2;
    const py = (cy === undefined ? r.height / 2 : cy - r.top) - r.height / 2;
    const k = ns / viewer.scale;
    viewer.x = px - (px - viewer.x) * k;
    viewer.y = py - (py - viewer.y) * k;
    viewer.scale = ns;
    applyZoom();
  }
  function stepViewer(d) {
    if (viewer.list.length < 2) return;
    viewer.index = (viewer.index + d + viewer.list.length) % viewer.list.length;
    showViewerImage();
  }
  (function bindViewer() {
    const stage = $('vstage');
    stage.addEventListener('wheel', (e) => { e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY); }, { passive: false });
    stage.addEventListener('dblclick', (e) => { e.preventDefault(); viewer.scale > 1.01 ? resetZoom() : zoomBy(2, e.clientX, e.clientY); });
    stage.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.vnav')) return;
      viewer.drag = true; viewer.sx = e.clientX; viewer.sy = e.clientY;
      viewer.ox = viewer.x; viewer.oy = viewer.y;
      $('vimg').classList.add('grabbing');
      try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    });
    stage.addEventListener('pointermove', (e) => {
      if (!viewer.drag) return;
      viewer.x = viewer.ox + (e.clientX - viewer.sx);
      viewer.y = viewer.oy + (e.clientY - viewer.sy);
      applyZoom();
    });
    const end = (e) => { viewer.drag = false; $('vimg').classList.remove('grabbing'); try { stage.releasePointerCapture(e.pointerId); } catch (err) {} };
    stage.addEventListener('pointerup', end);
    stage.addEventListener('pointercancel', end);
    let pinch = 0;
    const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    stage.addEventListener('touchstart', (e) => { if (e.touches.length === 2) pinch = dist(e.touches); }, { passive: true });
    stage.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && pinch) {
        e.preventDefault();
        const d = dist(e.touches);
        zoomBy(d / pinch, (e.touches[0].clientX + e.touches[1].clientX) / 2, (e.touches[0].clientY + e.touches[1].clientY) / 2);
        pinch = d;
      }
    }, { passive: false });
    stage.addEventListener('touchend', () => { pinch = 0; });
    document.querySelector('.vbar').addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const act = b.dataset.act;
      if (act === 'zoomin') zoomBy(1.25);
      else if (act === 'zoomout') zoomBy(1 / 1.25);
      else if (act === 'reset') resetZoom();
      else if (act === 'close') closeViewer();
    });
    $('vprev').onclick = () => stepViewer(-1);
    $('vnext').onclick = () => stepViewer(1);
    V().addEventListener('click', (e) => { if (e.target === V() || e.target === stage) closeViewer(); });
    document.addEventListener('keydown', (e) => {
      if (!V().classList.contains('on')) return;
      if (e.key === 'Escape') closeViewer();
      else if (e.key === 'ArrowLeft') stepViewer(-1);
      else if (e.key === 'ArrowRight') stepViewer(1);
      else if (e.key === '+' || e.key === '=') zoomBy(1.25);
      else if (e.key === '-') zoomBy(1 / 1.25);
      else if (e.key === '0') resetZoom();
    });
  })();
  $('list').addEventListener('click', (e) => {
    const hit = e.target.closest('img[data-zoom],[data-preview]');
    if (!hit) return;
    const row = e.target.closest('.msg');
    if (!row) return;
    const imgs = Array.from(row.querySelectorAll('img[data-zoom]'));

    openViewer(imgs.map((n) => ({ url: n.dataset.zoom, name: n.dataset.name || '' })), Math.max(0, imgs.indexOf(target)));
  });

  function openEffortPopover() {
    const box = $('popover');
    const EFFORTS = ['', 'low', 'medium', 'high'];
    const LABELS = { '': '自动', low: '低', medium: '中', high: '高' };
    const cur = (options && options.effort) || '';
    box.innerHTML = '<div class="po-title">思考强度</div>' +

      '</div><div class="po-desc" style="padding:0 10px 6px">越高越聪明、也越慢；支持拖动或点击</div>';
    const seg = $('effort-seg');
    const idxOf = (v) => Math.max(0, EFFORTS.indexOf(v || ''));
    const paint = (idx, commit) => {
      $('seg-thumb').style.transform = 'translateX(' + (idx * 100) + '%)';

    paint(idxOf(cur));
    let dragging = false;
    const frac = (x) => {
      const r = seg.getBoundingClientRect();
      const pad = 3, w = (r.width - pad * 2) / EFFORTS.length;
      return Math.max(0, Math.min(EFFORTS.length - 1, (x - r.left - pad) / w - 0.5));
    };
    seg.addEventListener('pointerdown', (e) => {
      dragging = true; seg.classList.add('dragging');
      try { seg.setPointerCapture(e.pointerId); } catch (err) {}
      paint(Math.round(frac(e.clientX)));

    seg.addEventListener('pointermove', (e) => { if (dragging) { $('seg-thumb').style.transform = 'translateX(' + (frac(e.clientX) * 100) + '%)'; paint(Math.round(frac(e.clientX))); } });
    const stop = (e) => {
      if (!dragging) return;
      dragging = false; seg.classList.remove('dragging');
      const v = EFFORTS[Math.round(frac(e.clientX))];
      if (v === cur) { paint(idxOf(cur)); return; }
      setPrefs({ effort: v });

    seg.addEventListener('pointerup', stop);

  function renderWsPath(rel) {

    const el = $('ws-path');
    el.innerHTML = html;
    el.querySelectorAll('a').forEach((a) => { a.onclick = (e) => { e.preventDefault(); wsPath = a.dataset.p || ''; loadWorkspace(); }; });
  }

  // ---------- 斜杠命令 ----------
  const CMDS = [
    { c: '/help', d: '显示帮助' },
    { c: '/status', d: '服务 / 连接状态' },
    { c: '/memory', d: '记忆概况（clear 清空，summary 看摘要）' },
    { c: '/bind', d: '绑定 MC 身份', arg: '<MC名>' },
    { c: '/unbind', d: '解绑 MC 身份' },
    { c: '/myid', d: '看自己的身份' }
  ];
  let cmdList = [], cmdIndex = 0;
  function syncPalette() {
    const v = $('text').value;
    if (!v.startsWith('/') || v.includes(' ') || v.includes('\n') || v.length > 16) { $('cmdpalette').classList.remove('on'); cmdList = []; return; }
    cmdList = CMDS.filter((x) => x.c.startsWith(v.toLowerCase()) && x.c !== v);
    if (!cmdList.length) { $('cmdpalette').classList.remove('on'); cmdList = []; return; }
    cmdIndex = Math.min(cmdIndex, cmdList.length - 1);
    const box = $('cmdpalette');
    box.innerHTML = '';
    cmdList.forEach((x, i) => {
      const b = document.createElement('button');
      b.className = 'cmd-item' + (i === cmdIndex ? ' on' : '');
      b.innerHTML = '<span class="c">' + esc(x.c + (x.arg ? ' ' + x.arg : '')) + '</span><span class="d">' + esc(x.d) + '</span>';
      b.onmousedown = (e) => { e.preventDefault(); applyCmd(x); };
      box.appendChild(b);
    });
    closePopovers('cmdpalette');
    box.classList.add('on');
  }
  function applyCmd(x) {
    $('text').value = x.c + (x.arg ? ' ' : '');
    $('cmdpalette').classList.remove('on');
    autoGrow(); $('text').focus();
    $('text').setSelectionRange($('text').value.length, $('text').value.length);
  }

  // ---------- 输入 / 发送 ----------
  function autoGrow() {
    const t = $('text');
    t.style.height = 'auto';
    t.style.height = Math.min(t.scrollHeight, 200) + 'px';
    updateSendBtn();
  }
  function updateSendBtn() {
    const ready = ($('text').value.trim() || pending.some((p) => p.done)) && !pending.some((p) => !p.done && !p.err);
    $('send').classList.toggle('ready', !!ready);
    $('send').disabled = !ready;
  }
  $('text').addEventListener('input', () => { autoGrow(); syncPalette(); });
  $('text').addEventListener('keydown', (e) => {
    if ($('cmdpalette').classList.contains('on') && cmdList.length) {
      if (e.key === 'ArrowDown') { e.preventDefault(); cmdIndex = (cmdIndex + 1) % cmdList.length; syncPalette(); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); cmdIndex = (cmdIndex - 1 + cmdList.length) % cmdList.length; syncPalette(); return; }
      if (e.key === 'Tab' || (e.key === 'Enter' && !e.isComposing)) { e.preventDefault(); applyCmd(cmdList[cmdIndex]); return; }
      if (e.key === 'Escape') { e.preventDefault(); $('cmdpalette').classList.remove('on'); return; }
    }
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMsg(); }
  });
  document.querySelectorAll('.suggests button').forEach((b) => {
    b.onclick = () => { $('text').value = b.dataset.q; autoGrow(); $('text').focus(); };
  });
  async function sendMsg() {
    const text = $('text').value.trim();
    const files = pending.filter((p) => p.done).map((p) => p.file);
    if (!text && !files.length) return;
    if (pending.some((p) => !p.done && !p.err)) { showError('还有文件在上传，稍等'); return; }
    $('send').disabled = true;
    try {
      await api('/api/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: text, files: files }) });
      $('text').value = ''; autoGrow();
      pending.forEach((p) => p.url && URL.revokeObjectURL(p.url));
      pending = []; renderPending();
      setTyping(true);
      setTimeout(() => { if (waiting) setTyping(false); }, 180000);
    } catch (e) {
      showError(e.message);
    } finally {
      updateSendBtn();
    }
  }
  $('send').onclick = sendMsg;

  // ---------- 上传 ----------
  function renderPending() {
    const box = $('pending');
    box.innerHTML = '';
    pending.forEach((p) => {
      const chip = document.createElement('div');
      chip.className = 'chip' + (p.done ? ' done' : '');
      if (p.isImage) {
        chip.innerHTML = '<img src="' + p.url + '" alt="">';
        chip.querySelector('img').onclick = () => {
          const imgs = pending.filter((q) => q.isImage && q.url);
          openViewer(imgs.map((q) => ({ url: q.url, name: q.name })), imgs.indexOf(p));
        };
      } else {
        chip.innerHTML = '<div class="doc">' + ICON.file + '<span class="n">' + esc(p.name) + '</span></div>';
      }
      if (!p.done) {
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.width = Math.round((p.progress || 0) * 100) + '%';
        chip.appendChild(bar);
      }
      if (p.note && p.done) {
        const note = document.createElement('div');
        note.className = 'note';
        note.textContent = p.note;
        chip.appendChild(note);
      }
      const x = document.createElement('button');
      x.className = 'x';
      x.innerHTML = ICON.x;
      x.onclick = () => {
        if (p.url) URL.revokeObjectURL(p.url);
        pending.splice(pending.indexOf(p), 1);
        renderPending(); updateSendBtn();
      };
      chip.appendChild(x);
      p.el = chip;
      box.appendChild(chip);
    });
    updateSendBtn();
  }
  async function compressImage(file) {
    const type = (file.type || '').toLowerCase();
    if (!/^image\/(png|jpe?g|webp|bmp|avif)$/.test(type)) return null;
    if (file.size < 400 * 1024) return null;
    let bitmap;
    try { bitmap = await createImageBitmap(file); } catch (e) { return null; }
    const maxDim = 1600;
    const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
    const w = Math.max(1, Math.round(bitmap.width * scale));
    const h = Math.max(1, Math.round(bitmap.height * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
    if (bitmap.close) try { bitmap.close(); } catch (e) {}
    const blob = await new Promise((res) => { try { canvas.toBlob(res, 'image/jpeg', 0.85); } catch (e) { res(null); } });
    if (!blob || blob.size >= file.size) return null;
    const base = (file.name || 'image').replace(/\.[^.]+$/, '');
    return new File([blob], base + '.jpg', { type: 'image/jpeg' });
  }
  function uploadOne(file, onProgress) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload?name=' + encodeURIComponent(file.name));
      xhr.setRequestHeader('Authorization', 'Bearer ' + token);
      xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
      xhr.onload = () => {
        let body = null;
        try { body = JSON.parse(xhr.responseText); } catch (e) {}
        if (xhr.status >= 200 && xhr.status < 300) resolve(body);
        else if (xhr.status === 401) { logout(true); reject(new Error('登录已失效')); }
        else reject(new Error((body && body.error) || ('HTTP ' + xhr.status)));
      };
      xhr.onerror = () => reject(new Error('网络错误'));
      xhr.send(file);
    });
  }
  async function addFiles(fileList) {
    const jobs = [];
    for (const f of Array.from(fileList)) {
      if (f.size > 20 * 1024 * 1024) { showError('「' + f.name + '」超过 20MB 上限'); continue; }
      jobs.push({ original: f, isImage: /^image\//.test(f.type || '') });
    }
    const prepared = await Promise.all(jobs.map(async (j) => {
      const smaller = await compressImage(j.original);
      return { file: smaller || j.original, isImage: j.isImage, saved: smaller ? j.original.size - smaller.size : 0 };
    }));
    for (const p of prepared) {
      const item = {
        file: p.file, name: p.file.name, isImage: p.isImage || /^image\//.test(p.file.type || ''),
        progress: 0, done: false, note: p.saved > 0 ? '已压缩 ' + fmtSize(p.saved) : '',
        url: p.isImage ? URL.createObjectURL(p.file) : ''
      };
      pending.push(item); renderPending();
      uploadOne(p.file, (v) => {
        item.progress = v;
        const b = item.el && item.el.querySelector('.bar');
        if (b) b.style.width = Math.round(v * 100) + '%';
      }).then((ref) => { item.file = ref; item.done = true; renderPending(); })
        .catch((e) => { item.err = true; showError('上传失败：' + e.message); pending.splice(pending.indexOf(item), 1); renderPending(); });
    }
    $('text').focus();
  }
  $('file').onchange = () => { addFiles($('file').files); $('file').value = ''; };
  document.addEventListener('paste', (e) => {
    if ($('app').style.display === 'none') return;
    const files = e.clipboardData && e.clipboardData.files;
    if (files && files.length) { e.preventDefault(); addFiles(files); }
  });
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => { e.preventDefault(); if (++dragDepth === 1) $('drop').classList.add('on'); });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('drop').classList.remove('on'); } });
  window.addEventListener('drop', (e) => {
    e.preventDefault(); dragDepth = 0; $('drop').classList.remove('on');
    if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  // ---------- 启动 ----------
  if (token && me) {
    api('/api/me').then((res) => {
      admin = !!res.admin; me = res.name;
      localStorage.setItem('mineagent.admin', admin ? '1' : '0');
      startChat();
    }).catch(() => logout(true));
  } else {
    logout(true);
  }
})();
</script>
</body>
</html>
