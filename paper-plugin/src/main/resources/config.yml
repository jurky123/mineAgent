backend:
  url: "ws://127.0.0.1:8765/ws"
  token: ""
  reconnect:
    initial-delay-ms: 1000
    max-delay-ms: 30000
  heartbeat-ms: 10000
ui:
  # auto：支持 MineUI server_ui 的玩家使用增强界面，其余使用原版对话框。
  # dialog：所有玩家使用原版对话框；无需任何客户端 mod。
  mode: auto
  # 可选：门户的 HTTPS 根地址，不含令牌或查询参数。空字符串隐藏网页入口。
  portal-url: ""
worldedit-protection:
  # Applies only to the named AI player's WorldEdit edits, including undo/paste.
  enabled: false
  player: MineAgentBot
  world: world
  # Inclusive square around the world's current spawn; all vertical heights.
  radius: 512
