<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MineAgent</title>
<style>
  :root {
    --bg: #f5f5f7; --bg-soft: #f0f0f3; --surface: #ffffff; --surface-2: #f2f3f5;
    --line: rgba(17,20,26,.08); --line-2: rgba(17,20,26,.16);
    --text: #1d1f24; --dim: #63666e; --dim2: #93979f;
    --accent: #6366f1; --accent-2: #a855f7;
    --accent-soft: rgba(99,102,241,.1); --accent-line: rgba(99,102,241,.35);
    --ok: #059669; --warn: #b45309; --err: #dc2626;
    --shadow-1: 0 1px 2px rgba(16,24,40,.07);
    --shadow-2: 0 14px 36px rgba(16,24,40,.14);
    --glow: 0 0 0 3px rgba(99,102,241,.18);
    --r-lg: 24px; --r-md: 16px; --r-sm: 11px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    color: var(--text);
    background:
      radial-gradient(1100px 760px at 10% -12%, rgba(99,102,241,.09), transparent 60%),
      radial-gradient(900px 680px at 102% -8%, rgba(168,85,247,.08), transparent 55%),
      var(--bg);
    font: 15.5px/1.75 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
      "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  a { color: #4f46e5; text-decoration-thickness: 1px; text-underline-offset: 2px; }
  button { font: inherit; cursor: pointer; color: inherit; }
  ::selection { background: rgba(99,102,241,.22); }
  :focus-visible { outline: 2px solid rgba(99,102,241,.6); outline-offset: 2px; border-radius: 8px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(17,20,26,.16); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(17,20,26,.28); background-clip: padding-box; }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes popout { to { opacity: 0; transform: translateY(6px) scale(.985); } }
  @keyframes fadeout { to { opacity: 0; } }
  @keyframes screenIn { from { opacity: 0; transform: translateY(10px) scale(.995); } to { opacity: 1; transform: none; } }
  @keyframes screenOut { to { opacity: 0; transform: translateY(-6px) scale(.995); } }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* ---------- 登录 ---------- */
  #login {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: transparent; z-index: 50;
  }
  #login.enter { animation: screenIn .3s cubic-bezier(.2,.8,.2,1); }
  #login.leave { animation: screenOut .18s ease forwards; }
  .login-card {
    width: 100%; max-width: 388px; text-align: center; padding: 34px 30px 28px;
    background: rgba(255,255,255,.82); border: 1px solid var(--line); border-radius: 26px;
    box-shadow: var(--shadow-2); backdrop-filter: blur(20px) saturate(140%);
  }
  .logo {
    width: 58px; height: 58px; margin: 0 auto 18px; border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 25px; color: #fff; letter-spacing: -.02em;
    box-shadow: 0 10px 26px rgba(99,102,241,.4), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .login-card h1 {
    margin: 0 0 8px; font-size: 24px; font-weight: 800; letter-spacing: -.02em;
    background: linear-gradient(120deg, #1d1f24, #4f46e5 62%, #a855f7);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .login-card p { margin: 0 0 24px; color: var(--dim); font-size: 13.5px; }
  .login-input {
    width: 100%; padding: 13px 16px; border-radius: 14px; border: 1px solid var(--line-2);
    background: #fff; color: var(--text); font: inherit; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .login-input::placeholder { color: var(--dim2); }
  .login-input:focus { border-color: rgba(99,102,241,.65); box-shadow: var(--glow); }
  .login-btn {
    width: 100%; margin-top: 14px; padding: 13px; border: 0; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
    font-weight: 700; letter-spacing: .01em; box-shadow: 0 8px 20px rgba(99,102,241,.32);
    transition: transform .12s, box-shadow .15s, filter .15s;
  }
  .login-btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .login-btn:disabled { opacity: .55; transform: none; }
  .login-err { color: var(--err); font-size: 13px; min-height: 19px; margin-top: 10px; }

  /* ---------- 布局 ---------- */
  #app { display: none; height: 100%; }
  #app.enter { animation: screenIn .3s cubic-bezier(.2,.8,.2,1); }
  #app.leave { animation: screenOut .18s ease forwards; }
  #sidebar {
    position: fixed; inset: 0 auto 0 0; width: 272px; z-index: 20;
    background: linear-gradient(180deg, rgba(252,252,253,.94), rgba(244,244,247,.94));
    border-right: 1px solid var(--line); backdrop-filter: blur(18px) saturate(140%);
    display: flex; flex-direction: column;
    transform: translateX(-100%); transition: transform .24s cubic-bezier(.2,.8,.2,1);
  }
  #sidebar.open { transform: none; box-shadow: 24px 0 60px rgba(16,24,40,.14); }
  #backdrop { display: none; position: fixed; inset: 0; background: rgba(15,18,25,.32); z-index: 15; backdrop-filter: blur(2px); }
  #backdrop.on { display: block; animation: fadein .2s ease; }
  @keyframes fadein { from { opacity: 0; } }
  .side-top { padding: 14px 12px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 16px; font-weight: 700; letter-spacing: -.01em; }
  .brand .logo {
    width: 30px; height: 30px; font-size: 14px; margin: 0; border-radius: 9px;
    box-shadow: 0 6px 16px rgba(99,102,241,.35), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .newchat {
    width: 100%; display: flex; align-items: center; gap: 9px; padding: 10px 13px;
    background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: 13px;
    font-size: 14px; font-weight: 600; color: #4338ca;
    transition: background .15s, transform .12s, box-shadow .15s;
  }
  .newchat:hover { background: rgba(99,102,241,.18); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(99,102,241,.18); }
  .side-foot { margin-top: auto; padding: 12px; border-top: 1px solid var(--line); }
  .userrow {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 13px;
    background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow-1);
  }
  .avatar {
    width: 31px; height: 31px; border-radius: 50%; flex: none; display: flex;
    align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35);
  }
  .userrow .uname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 600; }
  .badge { font-size: 11px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--dim2); }
  .badge.admin { color: var(--ok); border-color: rgba(5,150,105,.35); background: rgba(5,150,105,.09); }
  .logout {
    width: 100%; text-align: left; background: none; border: 0; color: var(--dim);
    font-size: 13px; padding: 9px 10px; border-radius: 10px; margin-top: 6px;
  }
  .logout:hover { background: rgba(17,20,26,.05); color: var(--text); }

  main { display: flex; flex-direction: column; height: 100%; }
  header {
    display: flex; align-items: center; gap: 10px; padding: 11px 18px; position: sticky; top: 0; z-index: 5;
    background: rgba(255,255,255,.75); backdrop-filter: blur(16px) saturate(150%);
    border-bottom: 1px solid var(--line);
  }
  .menu { display: none; background: none; border: 0; font-size: 19px; padding: 5px 9px; border-radius: 10px; color: var(--dim); }
  .menu:hover { background: rgba(17,20,26,.06); color: var(--text); }
  header .title { font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
  header .sub { color: var(--dim2); font-size: 12.5px; flex: 1; }
  .modelchip {
    display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px;
    background: var(--accent-soft); border: 1px solid var(--accent-line); color: #4338ca;
    font-size: 12px; font-weight: 600; white-space: nowrap; transition: background .15s, transform .12s;
  }
  .modelchip:hover { background: rgba(99,102,241,.18); transform: translateY(-1px); }

  #list { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  #listInner { max-width: 788px; margin: 0 auto; padding: 18px 22px 44px; }
  .empty { padding: 13vh 0 0; text-align: center; }
  .empty h2 {
    font-weight: 800; font-size: 30px; letter-spacing: -.02em; margin: 0 0 30px;
    background: linear-gradient(120deg, #1d1f24, #4f46e5 58%, #a855f7);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .suggests { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; max-width: 560px; margin: 0 auto; }
  .suggests button {
    display: flex; align-items: center; gap: 9px; text-align: left;
    background: #fff; border: 1px solid var(--line); border-radius: 15px; padding: 13px 15px;
    font-size: 13.5px; color: var(--dim); box-shadow: var(--shadow-1);
    transition: transform .14s, border-color .15s, color .15s, box-shadow .15s;
  }
  .suggests button::before { font-size: 17px; }
  .suggests button:nth-child(1)::before { content: "🎮"; }
  .suggests button:nth-child(2)::before { content: "📊"; }
  .suggests button:nth-child(3)::before { content: "🎨"; }
  .suggests button:nth-child(4)::before { content: "⌨️"; }
  .suggests button:hover { color: var(--text); border-color: var(--line-2); transform: translateY(-2px); box-shadow: var(--shadow-2); }

  .msg { padding: 15px 0; display: flex; gap: 14px; animation: rise .22s ease both; }
  .msg .avatar {
    width: 32px; height: 32px; margin-top: 2px; border-radius: 11px; font-size: 13.5px;
    box-shadow: 0 6px 14px rgba(99,102,241,.3), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .msg .body { min-width: 0; flex: 1; }
  .msg.user { justify-content: flex-end; }
  .msg.user .body { flex: none; max-width: 82%; display: flex; flex-direction: column; align-items: flex-end; }
  .msg.user .content {
    background: linear-gradient(135deg, rgba(99,102,241,.14), rgba(168,85,247,.1));
    border: 1px solid var(--accent-line); border-radius: 19px 19px 7px 19px;
    padding: 11px 16px; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: var(--shadow-1);
  }
  .msg.assistant .content { overflow-wrap: anywhere; }
  .msg .meta { font-size: 11.5px; color: var(--dim2); margin-bottom: 3px; letter-spacing: .01em; }
  .msg .actions { opacity: 0; transition: opacity .15s, transform .15s; transform: translateY(2px); margin-top: 4px; }
  .msg:hover .actions { opacity: 1; transform: none; }
  .act {
    background: #fff; border: 1px solid var(--line); color: var(--dim); font-size: 12px;
    padding: 4px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px;
    box-shadow: var(--shadow-1);
  }
  .act:hover { background: var(--surface-2); color: var(--text); border-color: var(--line-2); }

  .content pre {
    position: relative; background: #f6f7f9; border: 1px solid var(--line);
    border-radius: 14px; padding: 15px 16px; overflow-x: auto; font-size: 13.5px; margin: 11px 0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6);
  }
  .content code {
    background: rgba(17,20,26,.06); padding: 1.5px 6px; border-radius: 6px; font-size: 13.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .content pre code { background: none; padding: 0; }
  .codecopy {
    position: absolute; top: 8px; right: 8px; font-size: 11px; padding: 3px 9px; border-radius: 8px;
    border: 1px solid var(--line); background: rgba(255,255,255,.9); color: var(--dim);
    box-shadow: var(--shadow-1);
  }
  .codecopy:hover { color: var(--text); background: #fff; }
  .content h1, .content h2, .content h3 { margin: 15px 0 6px; font-weight: 700; letter-spacing: -.01em; }
  .content h1 { font-size: 20px; } .content h2 { font-size: 18px; } .content h3 { font-size: 16px; }
  .content ul { margin: 6px 0; padding-left: 24px; }
  .content li { margin: 3px 0; }
  .content > div:empty { height: 9px; }

  .files { display: flex; flex-direction: column; gap: 9px; margin-top: 9px; }
  .imgbox { position: relative; max-width: 350px; border-radius: 16px; }
  .imgbox img {
    width: 100%; border-radius: 16px; border: 1px solid var(--line); display: block; cursor: zoom-in;
    box-shadow: var(--shadow-1); transition: transform .18s ease, box-shadow .18s ease, border-color .18s;
  }
  .imgbox:hover img { transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: var(--line-2); }
  .imgtools { position: absolute; top: 9px; right: 9px; display: flex; gap: 6px; opacity: 0; transition: opacity .15s; }
  .imgbox:hover .imgtools { opacity: 1; }
  .itool {
    width: 31px; height: 31px; border-radius: 10px; border: 1px solid rgba(255,255,255,.16);
    display: flex; align-items: center; justify-content: center;
    background: rgba(12,13,18,.68); color: #fff; backdrop-filter: blur(8px);
    text-decoration: none; padding: 0; transition: background .15s, transform .12s;
  }
  .itool:hover { background: rgba(12,13,18,.9); transform: translateY(-1px); }
  .filecard {
    display: flex; align-items: center; gap: 12px; padding: 11px 13px; border-radius: 16px;
    background: #fff; border: 1px solid var(--line); color: inherit; text-decoration: none;
    font-size: 14px; max-width: 372px; box-shadow: var(--shadow-1);
    transition: transform .14s, border-color .15s, box-shadow .15s;
  }
  .filecard:hover { border-color: var(--line-2); transform: translateY(-1px); box-shadow: var(--shadow-2); }
  .ext {
    width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    flex: none; font-size: 9.5px; font-weight: 800; letter-spacing: .05em; color: #fff;
    background: #555; box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 3px 10px rgba(16,24,40,.2);
  }
  .ext.pdf { background: linear-gradient(160deg,#f87171,#b91c1c); }
  .ext.doc { background: linear-gradient(160deg,#60a5fa,#1d4ed8); }
  .ext.xls { background: linear-gradient(160deg,#4ade80,#15803d); }
  .ext.ppt { background: linear-gradient(160deg,#fbbf24,#b45309); }
  .ext.zip { background: linear-gradient(160deg,#fcd34d,#92610a); }
  .ext.img { background: linear-gradient(160deg,#c084fc,#7e22ce); }
  .ext.audio { background: linear-gradient(160deg,#f472b6,#be185d); }
  .ext.video { background: linear-gradient(160deg,#818cf8,#4338ca); }
  .ext.code { background: linear-gradient(160deg,#2dd4bf,#0f766e); }
  .ext.txt { background: linear-gradient(160deg,#94a3b8,#475569); }
  .filecard .fmeta { min-width: 0; flex: 1; }
  .filecard .fname { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .filecard .fsize { color: var(--dim2); font-size: 12px; }
  .filecard .fdl { color: var(--dim2); flex: none; display: flex; transition: color .15s, transform .15s; }
  .filecard:hover .fdl { color: var(--text); transform: translateY(-1px); }

  .typing .dots span {
    display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); animation: blink 1.2s infinite both;
  }
  .typing .dots span:nth-child(2) { animation-delay: .2s; }
  .typing .dots span:nth-child(3) { animation-delay: .4s; }
  .typing .content { color: var(--dim); }

  #tobottom {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 152px;
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line-2);
    background: rgba(255,255,255,.92); backdrop-filter: blur(10px); color: var(--dim);
    display: none; align-items: center; justify-content: center; z-index: 6; box-shadow: var(--shadow-2);
  }
  #tobottom.on { display: flex; }
  #tobottom:hover { color: var(--text); }

  .composer { padding: 0 22px calc(12px + env(safe-area-inset-bottom)); }
  .composer .inner { max-width: 788px; margin: 0 auto; position: relative; }
  #pending { display: flex; flex-wrap: wrap; gap: 10px; padding-bottom: 9px; }
  #pending:empty { display: none; }
  .chip {
    position: relative; width: 76px; height: 76px; border-radius: 16px; overflow: hidden;
    border: 1px solid var(--line-2); background: #fff; flex: none; box-shadow: var(--shadow-1);
  }
  .chip img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
  .chip .doc { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 5px; }
  .chip .doc .n { font-size: 10px; color: var(--dim); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .x {
    position: absolute; top: 4px; right: 4px; width: 21px; height: 21px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.2); background: rgba(20,22,28,.72); color: #fff;
    font-size: 12px; line-height: 1; padding: 0; backdrop-filter: blur(4px);
  }
  .chip .x:hover { background: rgba(220,38,38,.9); }
  .chip .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); width: 0; transition: width .15s; }
  .chip.done .bar { background: var(--ok); }
  .chip .note { position: absolute; left: 0; right: 0; bottom: 4px; font-size: 9px; text-align: center; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  .box {
    display: flex; align-items: flex-end; gap: 6px; padding: 8px;
    background: #fff; border: 1px solid var(--line); border-radius: 26px;
    box-shadow: 0 10px 30px rgba(16,24,40,.1);
    transition: border-color .15s, box-shadow .15s;
  }
  .box:focus-within { border-color: rgba(99,102,241,.55); box-shadow: 0 10px 30px rgba(16,24,40,.1), var(--glow); }
  .box textarea {
    flex: 1; resize: none; border: 0; outline: none; background: none; color: var(--text);
    font: inherit; max-height: 200px; min-height: 29px; padding: 8px 4px;
  }
  .box textarea::placeholder { color: var(--dim2); }
  .iconbtn {
    width: 38px; height: 38px; border-radius: 50%; border: 0; background: none; color: var(--dim);
    display: flex; align-items: center; justify-content: center; flex: none; font-size: 20px;
    transition: background .15s, color .15s, transform .15s;
  }
  .iconbtn:hover { background: rgba(17,20,26,.06); color: var(--text); }
  .iconbtn.send { background: rgba(17,20,26,.06); color: var(--dim2); }
  .iconbtn.send.ready {
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
    box-shadow: 0 6px 18px rgba(99,102,241,.4);
  }
  .iconbtn.send.ready:hover { transform: translateY(-1px) scale(1.04); filter: brightness(1.06); }
  .hint { text-align: center; color: var(--dim2); font-size: 11.5px; margin-top: 9px; letter-spacing: .01em; }
  .errline { color: var(--warn); }

  /* ---------- + 菜单 ---------- */
  #plusmenu {
    position: absolute; left: 0; bottom: calc(100% + 10px); width: 336px; max-width: calc(100vw - 24px);
    max-height: min(64vh, 540px); overflow-y: auto; padding: 10px; z-index: 12;
    background: rgba(255,255,255,.95); backdrop-filter: blur(24px) saturate(150%);
    border: 1px solid var(--line-2); border-radius: 20px; box-shadow: 0 24px 60px rgba(16,24,40,.2);
    display: none;
  }
  #plusmenu.on { display: block; animation: pop .16s ease-out; }
  #plusmenu.closing { animation: popout .14s ease forwards; }
  .pm-sec { padding: 7px 5px; }
  .pm-sec + .pm-sec { border-top: 1px solid var(--line); }
  .pm-title {
    font-size: 11px; color: var(--dim2); padding: 4px 9px 7px; display: flex; justify-content: space-between;
    text-transform: uppercase; letter-spacing: .09em; font-weight: 700;
  }
  .pm-item {
    display: flex; flex-direction: column; align-items: flex-start; gap: 1px; width: 100%;
    background: none; border: 0; text-align: left; padding: 9px 11px; border-radius: 12px; font-size: 14px;
    transition: background .12s;
  }
  .pm-item:hover { background: rgba(17,20,26,.05); }
  .pm-desc { font-size: 11.5px; color: var(--dim2); }
  .pm-filter {
    width: calc(100% - 18px); margin: 0 9px 7px; padding: 7px 11px; border-radius: 10px;
    border: 1px solid var(--line); background: rgba(17,20,26,.04); color: var(--text);
    font: inherit; outline: none; font-size: 13px;
  }
  .pm-filter:focus { border-color: rgba(99,102,241,.55); box-shadow: var(--glow); }
  .pm-list { max-height: 196px; overflow-y: auto; }
  .pm-item.model { flex-direction: row; align-items: center; justify-content: space-between; }
  .pm-item.model.on { background: var(--accent-soft); }
  .pm-check { color: var(--accent); font-size: 13px; visibility: hidden; }
  .pm-item.model.on .pm-check { visibility: visible; }

  /* ---------- 思考强度分段框（可拖可点） ---------- */
  .seg {
    position: relative; display: flex; margin: 2px 2px 0; padding: 3px; border-radius: 13px;
    background: rgba(17,20,26,.06); border: 1px solid var(--line); user-select: none; touch-action: none;
  }
  .seg-thumb {
    position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 4);
    border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 4px 12px rgba(99,102,241,.35), inset 0 1px 0 rgba(255,255,255,.35);
    transition: transform .34s cubic-bezier(.22,1.3,.36,1);
    z-index: 0; will-change: transform;
  }
  .seg.dragging .seg-thumb { transition: none; }
  .seg-item {
    position: relative; z-index: 1; flex: 1; border: 0; background: none; padding: 7px 0;
    font-size: 13px; color: var(--dim); border-radius: 10px; transition: color .18s;
    font-weight: 600;
  }
  .seg-item.on { color: #fff; }
  .seg-hint { display: flex; justify-content: space-between; padding: 7px 3px 0; font-size: 10.5px; color: var(--dim2); opacity: .85; }

  /* ---------- Toast ---------- */
  #toasts {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 130px; z-index: 60;
    display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none;
  }
  .toast {
    pointer-events: auto; max-width: min(560px, 90vw); cursor: pointer;
    background: rgba(255,255,255,.96); backdrop-filter: blur(18px); border: 1px solid var(--line-2);
    border-radius: 999px; padding: 9px 18px; font-size: 13.5px; color: var(--text);
    box-shadow: 0 14px 40px rgba(16,24,40,.18); animation: toastin .22s cubic-bezier(.2,.9,.3,1.2);
  }
  .toast.ok { border-color: rgba(5,150,105,.4); }
  .toast.err { border-color: rgba(220,38,38,.4); color: #b91c1c; }
  .toast.out { animation: toastout .24s forwards; }
  @keyframes toastin { from { opacity: 0; transform: translateY(10px) scale(.96); } }
  @keyframes toastout { to { opacity: 0; transform: translateY(8px) scale(.98); } }

  /* ---------- 斜杠命令面板 ---------- */
  #cmdpalette {
    position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); z-index: 11; padding: 6px;
    background: rgba(255,255,255,.96); backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid var(--line-2); border-radius: 16px; box-shadow: 0 20px 50px rgba(16,24,40,.2);
    display: none;
  }
  #cmdpalette.on { display: block; animation: pop .14s ease-out; }
  .cmd-item {
    display: flex; gap: 12px; align-items: baseline; width: 100%; background: none; border: 0;
    text-align: left; padding: 8px 11px; border-radius: 10px; font-size: 13.5px;
  }
  .cmd-item.on, .cmd-item:hover { background: rgba(17,20,26,.05); }
  .cmd-item .c { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #4338ca; min-width: 92px; }
  .cmd-item .d { color: var(--dim2); font-size: 12px; }

  /* ---------- 断线提示 / 载入更早 ---------- */
  #connbar {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 65;
    background: #fff7e6; border: 1px solid rgba(180,83,9,.3); color: #92400e;
    padding: 7px 16px; border-radius: 999px; font-size: 12.5px;
    box-shadow: 0 10px 28px rgba(16,24,40,.14);
  }
  #loadolder {
    display: block; margin: 2px auto 12px; padding: 7px 16px; border-radius: 999px;
    border: 1px solid var(--line); background: #fff; color: var(--dim); font-size: 12.5px;
    box-shadow: var(--shadow-1);
  }
  #loadolder:hover { background: var(--surface-2); color: var(--text); }

  .dropcard {
    border: 2px dashed rgba(99,102,241,.5); border-radius: 26px; padding: 46px 60px;
    display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 16px; color: var(--text);
    background: rgba(255,255,255,.92); backdrop-filter: blur(6px); box-shadow: var(--shadow-2);
  }
  .dropcard .icon { font-size: 36px; color: var(--accent); }

  #drop {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(245,245,247,.72); backdrop-filter: blur(4px); color: var(--text); font-size: 17px;
    z-index: 30; pointer-events: none;
  }
  #drop.on { display: flex; }

  [hidden] { display: none !important; }

  /* ---------- Workspace 弹层 ---------- */
  #wsmodal {
    position: fixed; inset: 0; background: rgba(15,18,25,.32); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; z-index: 35; padding: 20px;
  }
  #wsmodal.on { display: flex; animation: fadein .18s ease; }
  #wsmodal.closing { animation: fadeout .16s ease forwards; }
  #wsmodal.closing .ws-card { animation: popout .16s ease forwards; }
  .ws-card {
    width: 100%; max-width: 660px; max-height: 78vh; display: flex; flex-direction: column;
    background: rgba(255,255,255,.98); border: 1px solid var(--line-2); border-radius: 20px;
    overflow: hidden; box-shadow: 0 28px 70px rgba(16,24,40,.24); animation: pop .18s ease-out;
  }
  .ws-head { display: flex; align-items: center; gap: 8px; padding: 13px 15px; border-bottom: 1px solid var(--line); }
  .ws-path { flex: 1; font-size: 13px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-path a { color: var(--dim); text-decoration: none; }
  .ws-path a:hover { color: var(--text); text-decoration: underline; }
  .ws-list { overflow-y: auto; padding: 7px; }
  .ws-row {
    display: flex; align-items: center; gap: 11px; padding: 10px 11px; border-radius: 12px;
    color: inherit; text-decoration: none; font-size: 14px; cursor: pointer; border: 0;
    background: none; width: 100%; text-align: left; transition: background .12s;
  }
  .ws-row:hover { background: rgba(17,20,26,.05); }
  .ws-row .ws-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-row .ws-size { color: var(--dim2); font-size: 12px; }
  .ws-empty { color: var(--dim2); font-size: 13px; text-align: center; padding: 28px; }

  /* ---------- 查看器（保持暗色，看图的习惯） ---------- */
  #viewer { position: fixed; inset: 0; background: rgba(10,11,15,.95); display: none; z-index: 40; flex-direction: column; }
  #viewer.on { display: flex; animation: fadein .16s ease; }
  #viewer.closing { animation: fadeout .16s ease forwards; }
  .vbar {
    display: flex; align-items: center; gap: 7px; padding: 12px 16px; color: #eee;
    background: linear-gradient(rgba(0,0,0,.5), transparent);
  }
  .vname { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; color: #e6e6ea; }
  .vcount { color: #9a9aa2; font-size: 12px; flex: 1; }
  .vbtn {
    height: 34px; min-width: 34px; padding: 0 11px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.08); color: #eee; display: flex; align-items: center;
    justify-content: center; font-size: 13px; text-decoration: none; gap: 5px;
    backdrop-filter: blur(8px); transition: background .14s, transform .12s;
  }
  .vbtn:hover { background: rgba(255,255,255,.18); transform: translateY(-1px); }
  .vzoom { min-width: 48px; text-align: center; font-size: 12px; color: #b9b9c0; }
  .vstage { flex: 1; position: relative; overflow: hidden; touch-action: none; display: flex; align-items: center; justify-content: center; }
  .vimg {
    max-width: 100%; max-height: 100%; border-radius: 6px; user-select: none; -webkit-user-drag: none;
    transform-origin: center center; cursor: grab; box-shadow: 0 30px 80px rgba(0,0,0,.6);
  }
  .vimg.grabbing { cursor: grabbing; }
  .vnav {
    position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 64px;
    border: 1px solid rgba(255,255,255,.12); border-radius: 14px; background: rgba(255,255,255,.08);
    color: #fff; font-size: 27px; line-height: 1; backdrop-filter: blur(10px);
  }
  .vnav:hover { background: rgba(255,255,255,.2); }
  .vnav.prev { left: 16px; } .vnav.next { right: 16px; }
  .vmeta { padding: 10px 16px 16px; color: #8f8f97; font-size: 12px; text-align: center; }

  @media (min-width: 900px) {
    #sidebar { transform: none; }
    main { margin-left: 272px; }
    .menu { display: none; }
    #backdrop { display: none !important; }
  }
  @media (max-width: 899px) {
    .menu { display: block; }
    #listInner { padding: 10px 14px 34px; }
    .composer { padding-left: 12px; padding-right: 12px; }
    .msg.user .body { max-width: 88%; }
    .suggests { grid-template-columns: 1fr; max-width: 380px; }
    .empty h2 { font-size: 25px; }
    #tobottom { bottom: 140px; }
    .modelchip { display: none; }
  }
</style>
</head>
<body>

<div id="login">

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  let token = localStorage.getItem('mineagent.token') || '';
  let me = localStorage.getItem('mineagent.name') || '';
  let admin = localStorage.getItem('mineagent.admin') === '1';
  let lastId = 0;
  let pending = [];          // {file, name, progress, done, note, url}
  let msgIds = new Set();
  let es = null;
  let waiting = false;

  // ---------- 基础 ----------
  async function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers, { 'Authorization': 'Bearer ' + token });
    const res = await fetch(path, opts);
    let body = null;
    try { body = await res.json(); } catch (e) { /* 空响应 */ }
    if (res.status === 401) { logout(true); throw new Error('登录已失效，请重新进入'); }
    if (!res.ok) throw new Error((body && body.error) || ('HTTP ' + res.status));
    return body;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  // 附件 URL 兜底拼 token：cookie 没种上/被浏览器拦时 <img>、下载也能用。
  function withTok(u) {
    if (!u || u.startsWith('blob:') || u.startsWith('data:')) return u;
    return u + (u.indexOf('?') >= 0 ? '&' : '?') + 'token=' + encodeURIComponent(token);
  }
  function fmtSize(n) {
    if (!n && n !== 0) return '';
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1048576).toFixed(1) + ' MB';
  }
  function fmtTime(ms) {
    const d = new Date(ms || Date.now());
    return d.toTimeString().slice(0, 5);
  }
  // 轻量 Markdown：围栏代码/标题/列表/加粗/行内码/链接
  function renderContent(el, text) {
    // 先把代码块抽出来（多行安全），再逐行处理其余文本，占位符不会跟行号冲突。
    const blocks = [];
    const src = String(text).replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
      blocks.push('<pre><code>' + esc(code.replace(/\n$/, '')) + '</code></pre>');
      return '\u0000' + (blocks.length - 1) + '\u0000';
    });
    const inline = (s) => esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[^"'>])(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    const lines = src.split('\n');
    let out = [], list = null;
    const flushList = () => { if (list) { out.push('</ul>'); list = null; } };
    for (const raw of lines) {
      if (/^\u0000\d+\u0000$/.test(raw.trim())) { flushList(); out.push(raw.trim()); continue; }
      const h = raw.match(/^(#{1,3})\s+(.*)$/);
      const li = raw.match(/^\s*[-*]\s+(.*)$/);
      if (h) { flushList(); out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'); continue; }
      if (li) { if (!list) { out.push('<ul>'); list = true; } out.push('<li>' + inline(li[1]) + '</li>'); continue; }
      flushList();
      out.push(raw.trim() === '' ? '<div></div>' : '<div>' + inline(raw) + '</div>');
    }
    flushList();
    el.innerHTML = out.join('').replace(/\u0000(\d+)\u0000/g, (m, i) => blocks[+i]);
  }
  function scrollNearBottom() {
    const el = $('list');
    return el.scrollHeight - el.scrollTop - el.clientHeight < 160;
  }
  function toBottom() { const el = $('list'); el.scrollTop = el.scrollHeight; updateToBottom(); }
  function updateToBottom() {
    const el = $('list');
    $('tobottom').classList.toggle('on', el.scrollHeight - el.scrollTop - el.clientHeight > 320);
  }
  $('list').addEventListener('scroll', updateToBottom);
  $('tobottom').onclick = toBottom;

  // ---------- 消息渲染 ----------
  const ICON_DOWNLOAD = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>';
  const ICON_EXPAND = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H3v6"/><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M15 21h6v-6"/></svg>';
  // 按扩展名给文件卡片配色 + 角标（ChatGPT 风格的文件类型图标）
  function extInfo(name) {
    const ext = (String(name || '').split('.').pop() || '').toLowerCase();
    const map = {
      pdf: ['PDF', 'pdf'], doc: ['DOC', 'doc'], docx: ['DOC', 'doc'], rtf: ['RTF', 'doc'],
      xls: ['XLS', 'xls'], xlsx: ['XLS', 'xls'], csv: ['CSV', 'xls'],
      ppt: ['PPT', 'ppt'], pptx: ['PPT', 'ppt'],
      txt: ['TXT', 'txt'], md: ['MD', 'txt'], log: ['LOG', 'txt'],
      json: ['JSON', 'code'], js: ['JS', 'code'], ts: ['TS', 'code'], py: ['PY', 'code'],
      java: ['JAVA', 'code'], go: ['GO', 'code'], sh: ['SH', 'code'], html: ['HTML', 'code'],
      css: ['CSS', 'code'], xml: ['XML', 'code'], yml: ['YML', 'code'], yaml: ['YML', 'code'],
      zip: ['ZIP', 'zip'], rar: ['RAR', 'zip'], '7z': ['7Z', 'zip'], tar: ['TAR', 'zip'], gz: ['GZ', 'zip'],
      mp3: ['MP3', 'audio'], wav: ['WAV', 'audio'], m4a: ['M4A', 'audio'], flac: ['FLAC', 'audio'],
      mp4: ['MP4', 'video'], mov: ['MOV', 'video'], mkv: ['MKV', 'video'], webm: ['WEBM', 'video']
    };
    if (map[ext]) return map[ext];
    return [ext ? ext.slice(0, 4).toUpperCase() : 'FILE', 'txt'];
  }
  function fileBubble(f) {
    const name = f.name || '文件';
    if (f.image) {
      const src = withTok(f.url);
      return '<div class="imgbox"><img src="' + esc(src) + '" alt="' + esc(name) +
        '" loading="lazy" data-zoom="' + esc(src) + '" data-name="' + esc(name) + '">' +
        '<div class="imgtools">' +
        '<button class="itool" data-preview title="查看">' + ICON_EXPAND + '</button>' +
        '<a class="itool" href="' + esc(src) + '" download="' + esc(name) + '" title="下载">' + ICON_DOWNLOAD + '</a>' +
        '</div></div>';
    }
    const [label, cls] = extInfo(name);
    return '<a class="filecard" href="' + esc(withTok(f.url)) + '" download="' + esc(name) + '" title="' + esc(name) + '">' +
      '<span class="ext ' + cls + '">' + label + '</span>' +
      '<span class="fmeta"><span class="fname">' + esc(name) + '</span>' +
      (f.size ? '<span class="fsize">' + fmtSize(f.size) + '</span>' : '') + '</span>' +
      '<span class="fdl">' + ICON_DOWNLOAD + '</span></a>';
  }
  function addCodeCopy(row) {
    row.querySelectorAll('pre').forEach((pre) => {
      const btn = document.createElement('button');
      btn.className = 'codecopy';
      btn.textContent = '复制';
      btn.onclick = () => {
        const code = pre.querySelector('code');

  // ---------- 图片查看器 ----------
  const viewer = { list: [], index: 0, scale: 1, x: 0, y: 0, drag: false, sx: 0, sy: 0, ox: 0, oy: 0 };
  const V = () => $('viewer');
  function openViewer(list, index) {
    if (!list || !list.length) return;
    viewer.list = list;
    viewer.index = Math.max(0, Math.min(index || 0, list.length - 1));
    V().classList.add('on');
    document.body.style.overflow = 'hidden';
    showViewerImage();
  }
  function closeViewer() {
    if (!V().classList.contains('on')) return;
    hideAnimated(V(), () => { viewer.list = []; });
    document.body.style.overflow = '';
  }
  function showViewerImage() {
    const it = viewer.list[viewer.index] || {};
    const img = V().querySelector('.vimg');
    img.src = it.url; img.alt = it.name || '';
    V().querySelector('.vname').textContent = it.name || '';
    V().querySelector('.vcount').textContent = viewer.list.length > 1 ? (viewer.index + 1) + ' / ' + viewer.list.length : '';
    const many = viewer.list.length > 1;
    V().querySelector('.vnav.prev').style.visibility = many ? 'visible' : 'hidden';
    V().querySelector('.vnav.next').style.visibility = many ? 'visible' : 'hidden';
    const dl = V().querySelector('.vdl');
    dl.href = it.url || '';
    if (it.name) dl.setAttribute('download', it.name); else dl.removeAttribute('download');
    resetZoom();
  }
  function applyZoom() {
    V().querySelector('.vimg').style.transform =
      'translate(' + viewer.x + 'px,' + viewer.y + 'px) scale(' + viewer.scale + ')';
    V().querySelector('.vzoom').textContent = Math.round(viewer.scale * 100) + '%';
  }
  function resetZoom() { viewer.scale = 1; viewer.x = 0; viewer.y = 0; applyZoom(); }
  function zoomBy(f, cx, cy) {
    const ns = Math.min(8, Math.max(0.1, viewer.scale * f));
    const stage = V().querySelector('.vstage');
    const r = stage.getBoundingClientRect();
    const px = (cx === undefined ? r.width / 2 : cx - r.left) - r.width / 2;
    const py = (cy === undefined ? r.height / 2 : cy - r.top) - r.height / 2;
    const k = ns / viewer.scale;
    viewer.x = px - (px - viewer.x) * k;
    viewer.y = py - (py - viewer.y) * k;
    viewer.scale = ns;
    applyZoom();
  }
  function stepViewer(d) {
    if (viewer.list.length < 2) return;
    viewer.index = (viewer.index + d + viewer.list.length) % viewer.list.length;
    showViewerImage();
  }
  (function bindViewer() {
    const stage = V().querySelector('.vstage');
    stage.addEventListener('wheel', (e) => { e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY); }, { passive: false });
    stage.addEventListener('dblclick', (e) => { e.preventDefault(); viewer.scale > 1.01 ? resetZoom() : zoomBy(2, e.clientX, e.clientY); });
    stage.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.vnav')) return;
      viewer.drag = true; viewer.sx = e.clientX; viewer.sy = e.clientY;
      viewer.ox = viewer.x; viewer.oy = viewer.y;
      V().querySelector('.vimg').classList.add('grabbing');
      try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    });
    stage.addEventListener('pointermove', (e) => {
      if (!viewer.drag) return;
      viewer.x = viewer.ox + (e.clientX - viewer.sx);
      viewer.y = viewer.oy + (e.clientY - viewer.sy);
      applyZoom();
    });
    const endDrag = (e) => { viewer.drag = false; V().querySelector('.vimg').classList.remove('grabbing'); try { stage.releasePointerCapture(e.pointerId); } catch (err) {} };
    stage.addEventListener('pointerup', endDrag);
    stage.addEventListener('pointercancel', endDrag);
    // 触屏双指缩放
    let pinch = 0;
    const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    stage.addEventListener('touchstart', (e) => { if (e.touches.length === 2) pinch = dist(e.touches); }, { passive: true });
    stage.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && pinch) {
        e.preventDefault();
        const d = dist(e.touches);
        zoomBy(d / pinch, (e.touches[0].clientX + e.touches[1].clientX) / 2, (e.touches[0].clientY + e.touches[1].clientY) / 2);
        pinch = d;
      }
    }, { passive: false });
    stage.addEventListener('touchend', () => { pinch = 0; });
    V().querySelector('.vbar').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const act = btn.dataset.act;
      if (act === 'zoomin') zoomBy(1.25);
      else if (act === 'zoomout') zoomBy(1 / 1.25);
      else if (act === 'reset') resetZoom();
      else if (act === 'close') closeViewer();
    });
    V().querySelector('.vnav.prev').onclick = () => stepViewer(-1);
    V().querySelector('.vnav.next').onclick = () => stepViewer(1);
    V().addEventListener('click', (e) => {
      // 点图片以外的空白（遮罩/舞台）关闭；点图不关。
      if (e.target === V() || e.target === stage) closeViewer();
    });
    document.addEventListener('keydown', (e) => {
      if (!V().classList.contains('on')) return;
      if (e.key === 'Escape') closeViewer();
      else if (e.key === 'ArrowLeft') stepViewer(-1);
      else if (e.key === 'ArrowRight') stepViewer(1);
      else if (e.key === '+' || e.key === '=') zoomBy(1.25);
      else if (e.key === '-') zoomBy(1 / 1.25);
      else if (e.key === '0') resetZoom();
    });
  })();
  // 点击消息里的图片（或"查看"按钮）打开查看器，同一条消息的多张图可左右切换
  $('list').addEventListener('click', (e) => {
    const hit = e.target.closest('img[data-zoom],[data-preview]');
    if (!hit) return;
    const row = e.target.closest('.msg');
    if (!row) return;
    const imgs = Array.from(row.querySelectorAll('img[data-zoom]'));
    if (!imgs.length) return;
    const target = hit.tagName === 'IMG' ? hit : hit.closest('.imgbox').querySelector('img[data-zoom]');
    const idx = Math.max(0, imgs.indexOf(target));
    openViewer(imgs.map((n) => ({ url: n.dataset.zoom, name: n.dataset.name || '' })), idx);
  });

  // ---------- 登录 ----------
  async function doLogin(name) {
    $('enter').disabled = true;
    $('loginerr').textContent = '';
    try {
      const res = await fetch('/api/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name })
      });
      const body = await res.json().catch(() => null);
      if (!res.ok) throw new Error((body && body.error) || ('HTTP ' + res.status));
      token = body.token; me = body.name; admin = !!body.admin;
      localStorage.setItem('mineagent.token', token);
      localStorage.setItem('mineagent.name', me);
      localStorage.setItem('mineagent.admin', admin ? '1' : '0');
      startChat();
    } catch (e) {
      $('loginerr').textContent = e.message;
    } finally {
      $('enter').disabled = false;
    }
  }
  function showLogin() {
    const el = $('login');
    el.style.display = 'flex';
    el.classList.remove('leave');
    el.classList.add('enter');
    setTimeout(() => el.classList.remove('enter'), 320);
  }
  function hideLogin() {
    const el = $('login');
    if (el.style.display === 'none') return;
    el.classList.add('leave');
    setTimeout(() => { el.style.display = 'none'; el.classList.remove('leave'); }, 180);
  }
  function showApp() {
    const el = $('app');
    el.style.display = 'block';
    el.classList.remove('leave');
    el.classList.add('enter');
    setTimeout(() => el.classList.remove('enter'), 330);
  }
  function hideApp(done) {
    const el = $('app');
    if (el.style.display === 'none') { if (done) done(); return; }
    el.classList.add('leave');
    setTimeout(() => { el.style.display = 'none'; el.classList.remove('leave'); if (done) done(); }, 180);
  }
  function logout(silent) {
    token = ''; me = ''; admin = false;
    localStorage.removeItem('mineagent.token');
    localStorage.removeItem('mineagent.name');
    localStorage.removeItem('mineagent.admin');
    if (es) { es.close(); es = null; }
    clearMessages();
    hideApp(() => showLogin());
    if (!silent) $('loginerr').textContent = '';
  }
  $('enter').onclick = () => doLogin($('name').value.trim());
  $('name').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('enter').click(); });

    fetch('/api/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } }).catch(() => {});

  // ---------- 会话 ----------
  async function startChat() {
    hideLogin();
    showApp();
    $('myname').textContent = me;
    $('myavatar').textContent = (me[0] || '?').toUpperCase();
    $('myrole').textContent = admin ? '管理员' : '普通';
    $('myrole').className = 'badge' + (admin ? ' admin' : '');
    clearMessages();
    await loadHistory();
    connectSSE();
    loadOptions(true).catch(() => {});
    closeSidebar();
    $('text').focus();
  }
  async function loadHistory() {
    try {
      const body = await api('/api/history');
      for (const m of body.messages || []) { lastId = Math.max(lastId, m.id); renderMsg(m); }
      hasMore = !!body.hasMore;
      updateLoadOlder();
      if ((body.messages || []).length) toBottom();
    } catch (e) { showError(e.message); }
  }
  async function syncAfter() {
    try {
      const body = await api('/api/history?after=' + lastId);
      for (const m of body.messages || []) { lastId = Math.max(lastId, m.id); renderMsg(m); }
    } catch (e) { /* SSE 会推 */ }
  }
  function connectSSE() {
    if (es) es.close();
    es = new EventSource('/api/events?token=' + encodeURIComponent(token));
    es.addEventListener('message', (ev) => {
      try {
        const data = JSON.parse(ev.data);
        if (data.type === 'message' && data.message) {
          lastId = Math.max(lastId, data.message.id);
          renderMsg(data.message);
          if (data.message.role === 'agent') setTyping(false);
        } else if (data.type === 'cleared') {
          clearMessages();
        }
      } catch (e) { /* ignore */ }
    });
    es.onopen = () => syncAfter();
  }
  $('newchat').onclick = async () => {
    if ($('listInner').querySelectorAll('.msg').length && !confirm('开始新会话？当前对话记录和记忆会被清空。')) return;
    try { await api('/api/clear', { method: 'POST' }); clearMessages(); closeSidebar(); $('text').focus(); }
    catch (e) { showError(e.message); }
  };

  // ---------- 弹层 ----------
  // 带动画地关闭弹层（180ms 后真正移除 on 状态）
  function hideAnimated(el, done) {
    if (!el.classList.contains('on')) { if (done) done(); return; }
    el.classList.add('closing');
    setTimeout(() => { el.classList.remove('on', 'closing'); if (done) done(); }, 170);
  }

  function toast(msg, type) {
    const box = $('toasts');
    const t = document.createElement('div');
    t.className = 'toast ' + (type || '');
    t.textContent = msg;
    t.onclick = () => { t.classList.add('out'); setTimeout(() => t.remove(), 240); };
    box.appendChild(t);
    while (box.children.length > 3) box.firstChild.remove();
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 240); }, 3200);
  }
  function showError(msg) { toast(msg, 'err'); }

  // ---------- 历史分页（往上翻） ----------

  async function loadOlder() {
    const btn = $('loadolder');
    if (!oldestId || btn.disabled) return;
    btn.disabled = true; btn.textContent = '加载中…';
    try {
      const body = await api('/api/history?before=' + oldestId);
      const list = body.messages || [];

      list.forEach((m) => renderMsg(m, true));
      hasMore = !!body.hasMore;
      el.scrollTop = el.scrollHeight - prevH + prevTop;

    updateLoadOlder();

  function autoGrow() {
    const t = $('text');

    t.style.height = Math.min(t.scrollHeight, 200) + 'px';
    updateSendBtn();

  function updateSendBtn() {
    const ready = ($('text').value.trim() || pending.some((p) => p.done)) &&
      !pending.some((p) => !p.done && !p.err);
    $('send').classList.toggle('ready', !!ready);
    $('send').disabled = !ready;

  $('text').addEventListener('input', () => { autoGrow(); syncPalette(); });
  $('text').addEventListener('keydown', (e) => {
    if ($('cmdpalette').classList.contains('on') && cmdList.length) {
      if (e.key === 'ArrowDown') { e.preventDefault(); cmdIndex = (cmdIndex + 1) % cmdList.length; renderPalette(); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); cmdIndex = (cmdIndex - 1 + cmdList.length) % cmdList.length; renderPalette(); return; }
      if (e.key === 'Tab' || ((e.key === 'Enter') && !e.isComposing)) { e.preventDefault(); applyCmd(cmdList[cmdIndex]); return; }
      if (e.key === 'Escape') { e.preventDefault(); hidePalette(); return; }
    }
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMsg(); }
  });
  document.querySelectorAll('.suggests button').forEach((b) => {
    b.onclick = () => { $('text').value = b.dataset.q; autoGrow(); $('text').focus(); };

  async function sendMsg() {
    const text = $('text').value.trim();
    const files = pending.filter((p) => p.done).map((p) => p.file);
    if (!text && !files.length) return;
    if (pending.some((p) => !p.done && !p.err)) { showError('还有文件在上传，稍等'); return; }
    $('send').disabled = true;
    try {
      await api('/api/send', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text, files: files })
      });
      $('text').value = ''; autoGrow();
      pending.forEach((p) => p.url && URL.revokeObjectURL(p.url));
      pending = []; renderPending();
      setTyping(true);
      setTimeout(() => { if (waiting) setTyping(false); }, 180000);
    } catch (e) {
      showError(e.message);
    } finally {
      updateSendBtn();
    }
  }
  $('send').onclick = sendMsg;

  // ---------- 上传 ----------
  function renderPending() {
    const box = $('pending');
    box.innerHTML = '';
    pending.forEach((p) => {
      const chip = document.createElement('div');
      chip.className = 'chip' + (p.done ? ' done' : '');
      if (p.isImage) {
        chip.innerHTML = '<img src="' + p.url + '" alt="">';
        chip.querySelector('img').onclick = () => {
          const imgs = pending.filter((q) => q.isImage && q.url);
          openViewer(imgs.map((q) => ({ url: q.url, name: q.name })), imgs.indexOf(p));
        };
      } else {
        chip.innerHTML = '<div class="doc"><span style="font-size:20px">📄</span><span class="n">' + esc(p.name) + '</span></div>';
      }
      if (!p.done) {
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.width = Math.round((p.progress || 0) * 100) + '%';
        chip.appendChild(bar);
      }
      p.el = chip;
      if (p.note && p.done) {
        const note = document.createElement('div');
        note.className = 'note';
        note.textContent = p.note;
        chip.appendChild(note);
      }
      const x = document.createElement('button');
      x.className = 'x';
      x.textContent = '✕';
      x.onclick = () => {
        if (p.url) URL.revokeObjectURL(p.url);
        pending.splice(pending.indexOf(p), 1);
        renderPending(); updateSendBtn();
      };
      chip.appendChild(x);
      box.appendChild(chip);
    });
    updateSendBtn();
  }

  // 图片先压缩再传：聊天截图/照片动辄好几 MB，压到 1600px/JPEG 后通常小一个数量级。
  async function compressImage(file) {
    const type = (file.type || '').toLowerCase();
    if (!/^image\/(png|jpe?g|webp|bmp|avif)$/.test(type)) return null; // gif/svg 不动
    if (file.size < 400 * 1024) return null;                          // 小图不折腾
    let bitmap;
    try { bitmap = await createImageBitmap(file); } catch (e) { return null; }
    const maxDim = 1600;
    const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
    const w = Math.max(1, Math.round(bitmap.width * scale));
    const h = Math.max(1, Math.round(bitmap.height * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
    if (bitmap.close) try { bitmap.close(); } catch (e) {}
    const blob = await new Promise((res) => { try { canvas.toBlob(res, 'image/jpeg', 0.85); } catch (e) { res(null); } });
    if (!blob || blob.size >= file.size) return null;
    const base = (file.name || 'image').replace(/\.[^.]+$/, '');
    return new File([blob], base + '.jpg', { type: 'image/jpeg' });
  }

  function uploadOne(file, onProgress) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload?name=' + encodeURIComponent(file.name));
      xhr.setRequestHeader('Authorization', 'Bearer ' + token);
      xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
      xhr.onload = () => {
        let body = null;
        try { body = JSON.parse(xhr.responseText); } catch (e) {}
        if (xhr.status >= 200 && xhr.status < 300) resolve(body);
        else if (xhr.status === 401) { logout(true); reject(new Error('登录已失效')); }
        else reject(new Error((body && body.error) || ('HTTP ' + xhr.status)));
      };
      xhr.onerror = () => reject(new Error('网络错误'));
      xhr.send(file);
    });
  }

  async function addFiles(fileList) {
    const jobs = [];
    for (const f of Array.from(fileList)) {
      if (f.size > 20 * 1024 * 1024) { showError('「' + f.name + '」超过 20MB 上限'); continue; }
      const isImage = /^image\//.test(f.type || '');
      jobs.push({ original: f, isImage: isImage });
    }
    // 压缩（并行）之后逐个登记
    const prepared = await Promise.all(jobs.map(async (j) => {
      const smaller = await compressImage(j.original);
      return { file: smaller || j.original, isImage: j.isImage, saved: smaller ? j.original.size - smaller.size : 0 };
    }));
    for (const p of prepared) {
      const item = {
        file: p.file, name: p.file.name, isImage: p.isImage || /^image\//.test(p.file.type || ''),
        progress: 0, done: false, note: p.saved > 0 ? '已压缩 ' + fmtSize(p.saved) : '',
        url: p.isImage ? URL.createObjectURL(p.file) : ''
      };
      pending.push(item); renderPending();
      uploadOne(p.file, (v) => {
        item.progress = v;
        const b = item.el && item.el.querySelector('.bar');
        if (b) b.style.width = Math.round(v * 100) + '%';
      })
        .then((ref) => { item.file = ref; item.done = true; renderPending(); })
        .catch((e) => { item.err = true; showError('上传失败：' + e.message); pending.splice(pending.indexOf(item), 1); renderPending(); });
    }
    $('text').focus();
  }

  $('modelchip').onclick = (e) => { e.stopPropagation(); togglePlus(); };
  $('pm-upload').onclick = () => { closePlus(); $('file').click(); };
  $('file').onchange = () => { addFiles($('file').files); $('file').value = ''; };
  document.addEventListener('paste', (e) => {
    if ($('app').style.display === 'none') return;
    const files = e.clipboardData && e.clipboardData.files;
    if (files && files.length) { e.preventDefault(); addFiles(files); }
  });
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => { e.preventDefault(); if (++dragDepth === 1) $('drop').classList.add('on'); });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('drop').classList.remove('on'); } });
  window.addEventListener('drop', (e) => {
    e.preventDefault(); dragDepth = 0; $('drop').classList.remove('on');
    if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  // ---------- 斜杠命令面板 ----------
  const CMDS = [
    { c: '/help', d: '显示帮助' },
    { c: '/status', d: '服务 / 连接状态' },
    { c: '/memory', d: '记忆概况（clear 清空，summary 看摘要）' },
    { c: '/bind', d: '绑定 MC 身份', arg: '<MC名>' },
    { c: '/unbind', d: '解绑 MC 身份' },
    { c: '/myid', d: '看自己的身份' }
  ];
  let cmdList = [], cmdIndex = 0;
  function syncPalette() {
    const v = $('text').value;
    if (!v.startsWith('/') || v.includes(' ') || v.includes('\n') || v.length > 16) { hidePalette(); return; }
    cmdList = CMDS.filter((x) => x.c.startsWith(v.toLowerCase()) && x.c !== v);
    if (!cmdList.length) { hidePalette(); return; }
    cmdIndex = Math.min(cmdIndex, cmdList.length - 1);
    renderPalette();
  }
  function renderPalette() {
    const box = $('cmdpalette');
    box.innerHTML = '';
    cmdList.forEach((x, i) => {
      const b = document.createElement('button');
      b.className = 'cmd-item' + (i === cmdIndex ? ' on' : '');
      b.innerHTML = '<span class="c">' + esc(x.c + (x.arg ? ' ' + x.arg : '')) + '</span><span class="d">' + esc(x.d) + '</span>';
      b.onmousedown = (e) => { e.preventDefault(); applyCmd(x); };
      box.appendChild(b);
    });
    box.classList.add('on');
  }
  function hidePalette() { $('cmdpalette').classList.remove('on'); cmdList = []; }
  function applyCmd(x) {
    $('text').value = x.c + (x.arg ? ' ' : '');
    hidePalette(); autoGrow(); $('text').focus();
    $('text').setSelectionRange($('text').value.length, $('text').value.length);
  }

  // ---------- + 菜单（技能 / 模型 / 思考强度 / Workspace） ----------
  let options = null;
  function togglePlus() {
    const m = $('plusmenu');
    if (m.classList.contains('on')) { closePlus(); return; }
    m.classList.add('on');
    if (options) renderPlusMenu();      // 打开时重新定位拖动条（隐藏时量不到宽度）
    loadOptions().catch((e) => showError(e.message));
  }
  function closePlus() { hideAnimated($('plusmenu')); }
  document.addEventListener('click', (e) => {
    if (!$('plusmenu').classList.contains('on')) return;
    if (e.target.closest('#plusmenu') || e.target.closest('#attach')) return;
    closePlus();
  });
  async function loadOptions(force) {
    if (options && !force) { renderPlusMenu(); return options; }
    options = await api('/api/options');
    renderPlusMenu();
    return options;
  }
  function renderPlusMenu() {
    if (!options) return;
    // 技能
    const sec = $('pm-skills');
    sec.querySelectorAll('.pm-item').forEach((n) => n.remove());
    (options.skills || []).forEach((sk) => {
      const b = document.createElement('button');
      b.className = 'pm-item';
      b.innerHTML = '<span>' + esc(sk.name) + '</span>' + (sk.desc ? '<span class="pm-desc">' + esc(sk.desc) + '</span>' : '');
      b.onclick = () => {
        $('text').value = sk.prompt || sk.name;
        autoGrow(); closePlus(); $('text').focus();
        $('text').setSelectionRange($('text').value.length, $('text').value.length);
      };
      sec.appendChild(b);
    });
    // 工具（workspace 仅管理员）
    $('pm-tools').style.display = options.admin ? '' : 'none';
    // 模型
    renderModels($('pm-modelfilter').value || '');
    $('pm-model-cur').textContent = options.model || ('默认 · ' + (options.defaultModel || ''));
    // 顶栏模型 chip：显示当前模型与思考强度，点开 + 菜单
    const chip = $('modelchip');
    const mlabel = options.model || options.defaultModel || '';
    const elabel = options.effort ? ({ low: '低', medium: '中', high: '高' }[options.effort] || options.effort) : '';
    if (mlabel) {
      chip.hidden = false;
      chip.textContent = '⚙ ' + mlabel + (elabel ? ' · 思考' + elabel : '');
    } else {
      chip.hidden = true;
    }
    // 思考强度（分段框）
    renderEffortSeg();
  }

  // ---------- 思考强度：分段按钮框（可拖可点，滑块平滑吸附） ----------
  const EFFORTS = ['', 'low', 'medium', 'high'];
  const EFFORT_LABELS = { '': '自动', low: '低', medium: '中', high: '高' };
  let effDragging = false;
  function segIndex() { return Math.max(0, EFFORTS.indexOf((options && options.effort) || '')); }
  function renderEffortSeg() {
    if (!options) return;
    const idx = segIndex();
    $('pm-effort-cur').textContent = EFFORT_LABELS[EFFORTS[idx]] + (idx === 0 ? '（默认）' : '');
    $('seg-thumb').style.transform = 'translateX(' + (idx * 100) + '%)';
    $('effort-seg').querySelectorAll('.seg-item').forEach((b, i) => b.classList.toggle('on', i === idx));
  }
  (function bindSeg() {
    const seg = $('effort-seg');
    seg.setAttribute('tabindex', '0');
    const xToFrac = (clientX) => {
      const r = seg.getBoundingClientRect();
      const pad = 3, segW = (r.width - pad * 2) / EFFORTS.length;
      const f = (clientX - r.left - pad) / segW - 0.5;
      return Math.max(0, Math.min(EFFORTS.length - 1, f));
    };
    const preview = (f) => {
      $('seg-thumb').style.transform = 'translateX(' + (f * 100) + '%)';
      const near = Math.round(f);
      seg.querySelectorAll('.seg-item').forEach((b, i) => b.classList.toggle('on', i === near));
      $('pm-effort-cur').textContent = EFFORT_LABELS[EFFORTS[near]];
    };
    const onDown = (e) => {
      if (!options) return;
      effDragging = true;
      seg.classList.add('dragging');
      try { seg.setPointerCapture(e.pointerId); } catch (err) {}
      preview(xToFrac(e.clientX));
    };
    const onMove = (e) => { if (effDragging) preview(xToFrac(e.clientX)); };
    const onUp = (e) => {
      if (!effDragging) return;
      effDragging = false;
      seg.classList.remove('dragging');
      const v = EFFORTS[Math.round(xToFrac(e.clientX))];
      if (v === ((options && options.effort) || '')) { renderEffortSeg(); return; }
      setPrefs({ effort: v });
    };
    seg.addEventListener('pointerdown', onDown);
    seg.addEventListener('pointermove', onMove);
    seg.addEventListener('pointerup', onUp);
    seg.addEventListener('pointercancel', onUp);
    seg.addEventListener('keydown', (e) => {
      if (!options) return;
      const idx = segIndex();
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); setPrefs({ effort: EFFORTS[Math.min(EFFORTS.length - 1, idx + 1)] }); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); setPrefs({ effort: EFFORTS[Math.max(0, idx - 1)] }); }
    });
  })();

  function renderModels(filter) {
    const box = $('pm-models');
    box.innerHTML = '';
    const cur = options.model || '';
    const mk = (value, label, hint) => {
      const b = document.createElement('button');
      b.className = 'pm-item model' + (cur === value ? ' on' : '');
      b.innerHTML = '<span>' + esc(label) + (hint ? ' <span class="pm-desc">' + esc(hint) + '</span>' : '') + '</span><span class="pm-check">✓</span>';
      b.onclick = () => setPrefs({ model: value });
      box.appendChild(b);
    };
    mk('', '默认' + (options.defaultModel ? ' · ' + options.defaultModel : ''), '');
    const f = (filter || '').trim().toLowerCase();
    (options.models || []).forEach((m) => {
      if (f && m.toLowerCase().indexOf(f) < 0) return;
      mk(m, m, m === options.defaultModel ? '默认' : '');
    });
  }
  $('pm-modelfilter').addEventListener('input', () => { if (options) renderModels($('pm-modelfilter').value); });
  async function setPrefs(patch) {
    try {
      const r = await api('/api/prefs', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch)
      });
      options.model = r.model; options.effort = r.effort;
      renderPlusMenu();
      toast('已切换 · ' + [
        r.model || '默认模型',
        '思考强度 ' + (r.effort ? ({ low: '低', medium: '中', high: '高' }[r.effort] || r.effort) : '自动')
      ].join(' · '), 'ok');
    } catch (e) { showError(e.message); }
  }

  // ---------- Workspace 浏览器 ----------
  let wsPath = '';
  async function openWorkspace() {
    closePlus();
    $('wsmodal').classList.add('on');
    await loadWorkspace();
  }
  async function loadWorkspace() {
    const box = $('ws-list');
    box.innerHTML = '<div class="ws-empty">加载中…</div>';
    try {
      const res = await api('/api/workspace?path=' + encodeURIComponent(wsPath));
      renderWsPath(res.path || '');
      box.innerHTML = '';
      const entries = res.entries || [];
      if (wsPath) {
        const up = document.createElement('button');
        up.className = 'ws-row';
        up.innerHTML = '<span>📁</span><span class="ws-name">..</span>';
        up.onclick = () => { wsPath = wsPath.split('/').slice(0, -1).join('/'); loadWorkspace(); };
        box.appendChild(up);
      }
      if (!entries.length) {
        box.innerHTML += '<div class="ws-empty">这里是空的</div>';
      }
      entries.forEach((en) => {
        const full = (res.path ? res.path + '/' : '') + en.name;
        const row = document.createElement('a');
        row.className = 'ws-row';
        if (en.dir) {
          row.innerHTML = '<span>📁</span><span class="ws-name">' + esc(en.name) + '</span><span class="ws-size">›</span>';
          row.onclick = (e) => { e.preventDefault(); wsPath = full; loadWorkspace(); };
        } else {
          const [label, cls] = extInfo(en.name);
          const url = withTok('/api/workspace/file?path=' + encodeURIComponent(full));
          row.href = url;
          row.setAttribute('download', en.name);
          row.innerHTML = '<span class="ext ' + cls + '" style="width:28px;height:28px;font-size:9px">' + label + '</span>' +
            '<span class="ws-name">' + esc(en.name) + '</span>' +
            '<span class="ws-size">' + fmtSize(en.size || 0) + '</span>';
          if (/\.(png|jpe?g|gif|webp|bmp|avif)$/i.test(en.name)) {
            row.onclick = (e) => {
              e.preventDefault();
              openViewer([{ url: url, name: en.name }], 0);
            };
          }
        }
        box.appendChild(row);
      });
    } catch (e) {
      box.innerHTML = '<div class="ws-empty">' + esc(e.message) + '</div>';
    }
  }
  function renderWsPath(rel) {
    const parts = rel ? rel.split('/') : [];
    let html = '<a href="#" data-p="">workspace</a>';
    let acc = '';
    parts.forEach((seg) => {
      acc = acc ? acc + '/' + seg : seg;
      html += ' / <a href="#" data-p="' + esc(acc) + '">' + esc(seg) + '</a>';
    });
    const el = $('ws-path');
    el.innerHTML = html;
    el.querySelectorAll('a').forEach((a) => {
      a.onclick = (e) => { e.preventDefault(); wsPath = a.dataset.p || ''; loadWorkspace(); };
    });
  }
  $('pm-ws').onclick = openWorkspace;
  $('ws-close').onclick = () => hideAnimated($('wsmodal'));
  $('ws-refresh').onclick = () => loadWorkspace();
  $('wsmodal').addEventListener('click', (e) => { if (e.target === $('wsmodal')) hideAnimated($('wsmodal')); });

  // ---------- 启动 ----------
  if (token && me) {
    api('/api/me').then((res) => {
      admin = !!res.admin; me = res.name;
      localStorage.setItem('mineagent.admin', admin ? '1' : '0');
      startChat();
    }).catch(() => logout(true));
  } else {
    logout(true);
  }
})();
</script>
</body>
</html>
